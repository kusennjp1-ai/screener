name: Retained price admission inventory target
on:
  push:
    branches:
      - finite-admission-inventory-repair-a10
permissions:
  contents: read
  actions: read
concurrency:
  group: retained-price-admission-inventory-repair-a10
  cancel-in-progress: false
jobs:
  target:
    if: github.repository == 'kusennjp1-ai/screener' && github.event_name == 'push' && github.ref == 'refs/heads/finite-admission-inventory-repair-a10' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify final finite admission, readers, imports and ordinary configuration
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/retained-price-admission-inventory-tests"
          node --check .github/scripts/retained-price-admission-inventory.mjs
          node --check .github/scripts/retained-price-ci-admission.mjs
          node --check .github/scripts/publication-gate.mjs
          node --check .github/scripts/retained-price-admission-inventory-target.mjs
          node --test --test-concurrency=2 .github/scripts/retained-price-admission-inventory.test.mjs .github/scripts/retained-price-ci-admission.test.mjs .github/scripts/retained-price-source-admission.test.mjs .github/scripts/retained-price-source-driver.test.mjs .github/scripts/retained-price-live-inventory.test.mjs .github/scripts/retained-price-repository-inventory.test.mjs .github/scripts/retained-price-source-baseline.test.mjs .github/scripts/retained-price-source-browser.test.mjs .github/scripts/retained-price-source-readers.test.mjs .github/scripts/retained-price-source-workflow.test.mjs .github/scripts/retained-price-publisher-tooling.test.mjs .github/scripts/immutable-github-api.test.mjs 2>&1 | tee "$RUNNER_TEMP/retained-price-admission-inventory-tests/node.tap"
      - name: Install exact locked frontend tooling
        timeout-minutes: 4
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object package.json)" = "81dab927e85fea4031e3bca6e9751b6007b613f8"
          test "$(git hash-object package-lock.json)" = "3533b0f6ff61b73235da8765bccbdc754add0294"
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/retained-price-admission-inventory-tests/npm-ci.log"
      - name: Verify ordinary Vitest configuration and transformed finite imports
        timeout-minutes: 4
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run test:run -- tools/retained-price-source-imports.test.mjs tools/select-release-source.test.mjs tools/publication-gate.test.mjs tools/publication-state.test.mjs --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/retained-price-admission-inventory-tests/vitest.log"
      - name: Exercise actual admission adapter with same-token complete metadata and immediate caller
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --max-old-space-size=384 .github/scripts/retained-price-admission-inventory-target.mjs
      - name: Retain bounded test and public metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-price-admission-inventory-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-price-admission-inventory-tests/
            ${{ runner.temp }}/retained-price-admission-inventory-target/
          if-no-files-found: error
          retention-days: 7
