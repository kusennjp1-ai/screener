name: Design Acceptance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Reviewed full commit SHA checked out only as the carry adapter comparison checkout (no UI build)'
        default: '1e1943e1d5f78a738a05baa69eb9f2e8508e32ac'
        type: string
  push:
    branches: [main]
  pull_request:
    paths: ['frontend/**', 'contracts/**', 'docs/design-review/**', '.github/scripts/**', '.github/financial-release-request.json', '.github/financial-activation-candidate.json', '.github/workflows/design-acceptance.yml', '.github/workflows/research-ui-release.yml', '.github/workflows/static-site.yml']

permissions:
  contents: read
  actions: read
concurrency:
  group: design-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-acceptance:
    name: Real-data design and performance budgets
    runs-on: ubuntu-latest
    # Authentic carry preparation and its replays precede the brief browser gates.
    # Keep a finite job cap; this changes runtime headroom, never acceptance budgets.
    timeout-minutes: 120
    env:
      BASELINE_REF: ${{ inputs.baseline_ref || '1e1943e1d5f78a738a05baa69eb9f2e8508e32ac' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated offline exchange calendar runtime
        run: |
          python -m venv "$RUNNER_TEMP/session-calendar-runtime"
          "$RUNNER_TEMP/session-calendar-runtime/bin/python" -m pip install -r .github/scripts/session-calendar-requirements.txt
          echo "SESSION_CALENDAR_PYTHON=$RUNNER_TEMP/session-calendar-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Install certified offline projection dependencies
        if: (hashFiles('.github/financial-release-request.json') != '')
        run: |
          python -m venv "$RUNNER_TEMP/financial-replay-runtime"
          "$RUNNER_TEMP/financial-replay-runtime/bin/python" -m pip install -r .github/scripts/financial-release-projection-requirements.txt
          echo "$RUNNER_TEMP/financial-replay-runtime/bin" >> "$GITHUB_PATH"
          echo "FINANCIAL_REPLAY_PYTHON=$RUNNER_TEMP/financial-replay-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Verify isolated offline native projection runtime
        if: (hashFiles('.github/financial-release-request.json') != '')
        env:
          PYTHONPATH: backend
          LITELLM_LOCAL_MODEL_COST_MAP: 'true'
        run: python -m unittest tests.unit.test_native_annual_projection.TestNativeAnnualProjection.test_new_policy_binds_source_without_changing_originals_or_quarterly_scalars
      - name: Prepare the certified financial candidate
        id: financial
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        run: node .github/scripts/financial-release-activation.mjs design-prepare
      # The brief has no verified financial-display contract yet. A prepared
      # correction candidate therefore fails closed here; its bytes are kept
      # for review by the UNAPPROVED diagnostic steps below and never sealed.
      - name: Refuse a financial candidate without a brief financial-display contract
        if: steps.financial.outputs.candidate == 'true'
        shell: bash
        run: |
          echo "::error title=No brief financial-display contract::A financial correction candidate was prepared, but the brief Design harness cannot verify its financial display. Design fails closed; the candidate is retained only as an UNAPPROVED diagnostic."
          exit 1
      - name: Restore checked input and prepare the carry comparison data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_REF: ${{ inputs.baseline_ref || '1e1943e1d5f78a738a05baa69eb9f2e8508e32ac' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/select-release-source.mjs design
          cp "$RUNNER_TEMP/verified-publication/state.json" "$RUNNER_TEMP/design-input-provenance.json"
          echo "DESIGN_INPUT_BASIS=same_verified_input" >> "$GITHUB_ENV"
          # The carry adapter binds an exact reviewed comparison checkout. No UI
          # is built from it; it only anchors the carry replay's code identity.
          # Synthetic PR-merge commits may be absent from the branch checkout.
          if [[ ! "$BASELINE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Design baseline requires a reviewed full commit SHA" >&2
            exit 1
          fi
          git fetch --no-tags -- origin "$BASELINE_REF"
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$BASELINE_REF"
          git clone --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/design-baseline"
          git -C "$RUNNER_TEMP/design-baseline" checkout --detach "$BASELINE_REF"
          test "$(git -C "$RUNNER_TEMP/design-baseline" rev-parse HEAD)" = "$BASELINE_REF"
          # Prepare one logical dataset before the build. The preview adapter
          # retains the original source/audit/history and never seals or admits
          # a financial source. No later exporter may rewrite it.
          echo "Design stage: $(date -u +%FT%TZ) carry-prepare start"
          node --max-old-space-size=4096 .github/scripts/design-financial-carry.mjs prepare "$RUNNER_TEMP/design-input-provenance.json" "$RUNNER_TEMP/design-baseline" 2>&1 | tee "$RUNNER_TEMP/design-carry-prepare.log"
          echo "Design stage: $(date -u +%FT%TZ) carry-prepare complete"
          if ! node --input-type=module -e 'import fs from "node:fs"; process.exit(JSON.parse(fs.readFileSync(process.argv[1])).schema === "design-financial-carry-preview-v1" ? 0 : 1)' "$RUNNER_TEMP/design-input-provenance.json"; then
            # Derive sessions only on the candidate copy, never in the retained archive.
            (cd frontend && env -u GH_TOKEN -u GITHUB_TOKEN "$SESSION_CALENDAR_PYTHON" -I tools/export-book-benchmark.py --calendar-only --root public/static-data --evaluated-at "$(date -u +%FT%TZ)" && node tools/export-research.mjs && node tools/record-candidate-history.mjs && node tools/check-data-quality.mjs)
          fi
          node .github/scripts/select-release-source.mjs check-design-data
          # A carry's transport verification replays against this separate raw
          # copy of the identical logical data (DESIGN_COMPARISON_BASELINE).
          comparison="$RUNNER_TEMP/design-baseline/frontend/dist"
          rm -rf "$comparison"
          mkdir -p "$comparison"
          cp -a frontend/public/static-data "$comparison/static-data"
          for file in research-daily.json portfolio-model.json qualification-audit.json ibd-reference.json; do
            cp "frontend/public/$file" "$comparison/$file"
          done
          # Includes top-level logical JSON, not merely static-data/.
          node --input-type=module -e 'import {dataInventoryDigest} from "./.github/scripts/publication-state.mjs"; if (dataInventoryDigest(process.argv[1]) !== dataInventoryDigest(process.argv[2])) throw Error("Design comparison data differs before build")' frontend/public "$comparison"
      # Diagnostic only, never a gate: the pre-registered market-regime study
      # (frontend/tools/market-regime-study.mjs) on the long history restored
      # above (the bytes the build below moves to design-current-data) and long
      # ^GSPC/^IXIC daily bars from Yahoo. It reads frontend/public only, writes
      # only under $RUNNER_TEMP, and every failure becomes a warning.
      - name: Diagnostic market-regime study (never a gate)
        shell: bash
        env:
          STUDY_OUT: ${{ runner.temp }}/market-regime-study
        run: |
          study() {
            mkdir -p "$STUDY_OUT" || return 1
            local calendar=()
            # Independent NYSE sessions from the isolated offline calendar runtime; otherwise provider dates, flagged in the report.
            if env -u GH_TOKEN -u GITHUB_TOKEN "$SESSION_CALENDAR_PYTHON" -I -c 'import json,sys,pandas_market_calendars as m; s=m.get_calendar("NYSE").schedule(start_date="1990-01-01",end_date=sys.argv[1]); json.dump([str(d.date()) for d in s.index],open(sys.argv[2],"w"))' "$(date -u +%F)" "$STUDY_OUT/nyse-sessions.json"; then
              calendar=(--calendar "$STUDY_OUT/nyse-sessions.json")
            else
              echo '::warning title=Market-regime study::Independent NYSE calendar unavailable; provider dates are used and flagged in the report.'
            fi
            env -u GH_TOKEN -u GITHUB_TOKEN timeout 900 node frontend/tools/market-regime-study.mjs --history frontend/public/static-data --yahoo "${calendar[@]}" --save-indices "$STUDY_OUT/indices.json" --label 'CI: live long history + Yahoo index history since 1990' --out "$STUDY_OUT/results.json" --markdown "$STUDY_OUT/results.md" || return 1
            cat "$STUDY_OUT/results.md" || return 1
            head -c 900000 "$STUDY_OUT/results.md" >> "$GITHUB_STEP_SUMMARY" || return 1
          }
          study || echo '::warning title=Market-regime study unavailable::Diagnostic only; the Design result is unaffected.'
      - name: Build the current UI and verify its packed transport
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: '/screener/'
        shell: bash
        run: |
          set -euo pipefail
          source="$GITHUB_WORKSPACE/frontend"
          # Vite-only after the checked input: the data tree is moved aside, never copied.
          mv "$source/public/static-data" "$RUNNER_TEMP/design-current-data"
          echo "Design stage: $(date -u +%FT%TZ) vite-current start"
          (cd "$source" && npx vite build)
          echo "Design stage: $(date -u +%FT%TZ) vite-current complete"
          mv "$RUNNER_TEMP/design-current-data" "$source/dist/static-data"
          # Diagnostic only: where the bytes go before the strict Pages budget is applied.
          (cd "$source" && node tools/site-size-breakdown.mjs dist 40) || echo '::warning::Site size breakdown unavailable'
          if [ -f "$source/dist/static-transport-capability.json" ]; then
            # Measure the decoder with its actual physical representation.
            echo "Design stage: $(date -u +%FT%TZ) transport-verify-pack-roundtrip start"
            node --max-old-space-size=4096 .github/scripts/design-transport.mjs "$source/dist" "$RUNNER_TEMP/design-input-provenance.json" 2>&1 | tee "$RUNNER_TEMP/design-transport.log"
            echo "Design stage: $(date -u +%FT%TZ) transport-verify-pack-roundtrip complete"
          fi
      - name: Measure the brief screens, accessibility and CPU 4x
        id: measure
        working-directory: frontend
        env:
          CURRENT_BUILD: dist
          DESIGN_REVIEW_OUTPUT: test-results/design-review
          DESIGN_INPUT_PROVENANCE: ${{ runner.temp }}/design-input-provenance.json
        shell: bash
        run: |
          set -euo pipefail
          echo "Design stage: $(date -u +%FT%TZ) browser-measurements start"
          node tools/design-review.mjs
          echo "Design stage: $(date -u +%FT%TZ) browser-measurements complete"
      - name: Require every capture, no objective failure, and reviewed scores or the owner waiver
        if: (always())
        working-directory: frontend
        run: node tools/check-design-review.mjs
      - name: Package UNAPPROVED financial diagnostics after unsuccessful Design
        id: financial_diagnostic
        if: ((failure() || cancelled()) && steps.financial.outcome == 'success' && steps.financial.outputs.candidate == 'true')
        env:
          FINANCIAL_PREPARATION_OUTCOME: ${{ steps.financial.outcome }}
          FINANCIAL_CANDIDATE: ${{ steps.financial.outputs.candidate }}
          DESIGN_JOB_STATUS: ${{ job.status }}
        run: python3 .github/scripts/retain-financial-diagnostic.py
      - name: Retain UNAPPROVED financial diagnostics for review only
        if: ((failure() || cancelled()) && steps.financial.outcome == 'success' && steps.financial.outputs.candidate == 'true' && steps.financial_diagnostic.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-financial-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/financial-release-candidate/unapproved-financial-diagnostic.tar.gz
            ${{ runner.temp }}/financial-release-candidate/unapproved-financial-diagnostic-metadata.json
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      # Unreachable while the refusal above stands: sealing requires a passing
      # Design of the exact candidate bytes, which the brief cannot yet verify.
      - name: Seal the exact tested financial candidate
        if: (success() && steps.financial.outputs.candidate == 'true' && env.DESIGN_CARRY_PREVIEW_PROVENANCE == '')
        run: node .github/scripts/financial-release-activation.mjs design-seal
      - name: Retain the exact tested financial candidate
        if: (success() && steps.financial.outputs.candidate == 'true' && env.DESIGN_CARRY_PREVIEW_PROVENANCE == '')
        uses: actions/upload-artifact@v4
        with:
          name: financial-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/financial-release-candidate/candidate.tar
          retention-days: 90
          if-no-files-found: error
      - name: Preserve all results even when a budget fails
        if: (always())
        uses: actions/upload-artifact@v4
        with:
          name: design-acceptance-${{ github.sha }}
          path: |
            frontend/test-results/design-review/
            ${{ runner.temp }}/design-input-provenance.json
            ${{ runner.temp }}/verified-publication/retained-universe-report.json
            ${{ runner.temp }}/design-carry-evidence/
            ${{ runner.temp }}/design-carry-verifier-reports/
            ${{ runner.temp }}/design-carry-prepare.log
            ${{ runner.temp }}/design-transport.log
            ${{ runner.temp }}/market-regime-study/
          retention-days: 90
