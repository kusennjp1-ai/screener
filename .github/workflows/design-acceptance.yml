name: Design Acceptance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline source revision; both builds use exactly the same checked input bundle'
        default: 'cd3a6a2'
        type: string
  push:
    branches: [main]
  pull_request:
    paths: ['frontend/**', 'docs/design-review/**', '.github/scripts/**', '.github/workflows/design-acceptance.yml', '.github/workflows/research-ui-release.yml', '.github/workflows/static-site.yml']

permissions:
  contents: read
  actions: read
concurrency:
  group: design-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-acceptance:
    name: Real-data design and performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Restore identical real input for both versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_REF: ${{ inputs.baseline_ref || 'cd3a6a2' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Both versions consume identical checked export/live input. Fresh
          # exports remain usable when the old Pages artifact has expired.
          node .github/scripts/select-release-source.mjs design
          cp "$RUNNER_TEMP/verified-publication/state.json" "$RUNNER_TEMP/design-input-provenance.json"
          git clone --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/design-baseline"
          git -C "$RUNNER_TEMP/design-baseline" checkout --detach "$BASELINE_REF"
          cp -a frontend/public/static-data "$RUNNER_TEMP/design-baseline/frontend/public/static-data"
          if cmp -s frontend/package-lock.json "$RUNNER_TEMP/design-baseline/frontend/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$RUNNER_TEMP/design-baseline/frontend/node_modules"
          else
            (cd "$RUNNER_TEMP/design-baseline/frontend" && npm ci --no-audit --no-fund)
          fi
      - name: Build both production versions without duplicating the large data tree
        id: production_builds
        env:
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: '/screener/'
        shell: bash
        run: |
          set -euo pipefail
          for target in baseline current; do
            if [ "$target" = baseline ]; then
              source="$RUNNER_TEMP/design-baseline/frontend"
            else
              source="$GITHUB_WORKSPACE/frontend"
            fi
            (cd "$source" && node tools/export-research.mjs && node tools/record-candidate-history.mjs)
            if [ "$target" = current ]; then
              (cd "$source" && node tools/check-data-quality.mjs)
              node .github/scripts/select-release-source.mjs check-design-data
            fi
            mv "$source/public/static-data" "$RUNNER_TEMP/design-$target-data"
            (cd "$source" && npx vite build)
            ln -s "$RUNNER_TEMP/design-$target-data" "$source/dist/static-data"
          done
          (cd frontend && node tools/build-radar-benchmark.mjs)
      - name: Measure all routes, screenshots, accessibility and CPU 4x
        working-directory: frontend
        env:
          CURRENT_BUILD: dist
          BASELINE_BUILD: ${{ runner.temp }}/design-baseline/frontend/dist
          RADAR_BUILD: test-results/radar-build
          DESIGN_REVIEW_OUTPUT: test-results/design-review
        run: node tools/design-review.mjs
      - name: Build frozen eager chart source for a separate same-data diagnostic
        if: always() && steps.production_builds.outcome == 'success'
        id: chart_eager_build
        env:
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: '/screener/'
          CHART_EAGER_REVISION: '80e7d5e5050a2880cc64378ca45dcdc1e2405d53'
          CHART_EAGER_TREE: '72e56751402a38b58ab89a8a3d30be6b2851bf82'
        shell: bash
        run: |
          set -euo pipefail
          # This diagnostic comparison is independent of the official cd3a6a2
          # baseline and runs only after all unchanged acceptance measurements.
          # A squash or deleted branch may leave the pinned source outside the
          # checkout's fetched history. Fetch only that commit, using the
          # checkout's existing read authorization, and fail closed if absent.
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$CHART_EAGER_REVISION^{commit}" 2>/dev/null; then
            timeout 60s git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$CHART_EAGER_REVISION"
          fi
          git clone --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/chart-eager"
          git -C "$RUNNER_TEMP/chart-eager" checkout --detach "$CHART_EAGER_REVISION"
          test "$(git -C "$RUNNER_TEMP/chart-eager" rev-parse 'HEAD^{tree}')" = "$CHART_EAGER_TREE"
          eager_source="$RUNNER_TEMP/chart-eager/frontend"
          cmp frontend/package-lock.json "$eager_source/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$eager_source/node_modules"
          if [ -e "$eager_source/public/static-data" ]; then
            mv "$eager_source/public/static-data" "$RUNNER_TEMP/chart-eager-unused-data"
          fi
          (cd "$eager_source" && npx vite build)
          # Reuse the current build's exact checked/exported publication; no
          # second export can change its date, generation, traces or charts.
          ln -s "$RUNNER_TEMP/design-current-data" "$eager_source/dist/static-data"
          for chart_source in "$eager_source" "$GITHUB_WORKSPACE/frontend"; do
            (cd "$chart_source" && node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              import { execFileSync } from "node:child_process";
              const git = arg => execFileSync("git", ["rev-parse", arg], { encoding: "utf8" }).trim();
              const revision = git("HEAD");
              writeFileSync("dist/build-source-provenance.json", JSON.stringify({ revision, tree: git("HEAD^{tree}"), label: revision === process.env.CHART_EAGER_REVISION ? "eager" : "current" }));
            ')
          done
      - name: Measure chart encounter and native rendering separately from budgets
        if: always() && steps.chart_eager_build.outcome == 'success'
        working-directory: frontend
        env:
          CURRENT_BUILD: dist
          CHART_EAGER_BUILD: ${{ runner.temp }}/chart-eager/frontend/dist
          CHART_EAGER_REVISION: '80e7d5e5050a2880cc64378ca45dcdc1e2405d53'
          CURRENT_REVISION: ${{ github.sha }}
          CHART_DIAGNOSTIC_OUTPUT: test-results/design-review/chart-viewport-diagnostic
        run: node tools/chart-viewport-diagnostic.mjs
      - name: Require reviewed screenshots and four design scores of at least 8.0
        if: always()
        working-directory: frontend
        run: node tools/check-design-review.mjs
      - name: Preserve all results even when a budget fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-acceptance-${{ github.sha }}
          path: |
            frontend/test-results/design-review/
            ${{ runner.temp }}/design-input-provenance.json
            ${{ runner.temp }}/verified-publication/retained-universe-report.json
          retention-days: 14
