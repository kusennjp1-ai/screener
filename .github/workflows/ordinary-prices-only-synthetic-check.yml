name: Check ordinary price-session CI contracts
on:
  push:
    branches:
      - ordinary-prices-only-synthetic-check-a11-v6
permissions:
  contents: read
concurrency:
  group: ordinary-prices-only-synthetic-check-a11-v6
  cancel-in-progress: false
jobs:
  synthetic:
    if: github.repository == 'kusennjp1-ai/screener' && github.event_name == 'push' && github.ref == 'refs/heads/ordinary-prices-only-synthetic-check-a11-v6' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      STOCKSCANNER_TEST_ALLOW_POSTGRES: '0'
      STOCKSCANNER_TEST_USE_DATABASE_URL: '0'
      STOCKSCANNER_TEST_ALLOW_SQLITE: '1'
      DATABASE_URL: sqlite://
      STATIC_SITE_CODE33: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Bind the exact disabled code-only candidate
        id: bind
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          assert sys.version_info[:2] == (3, 11), "Unexpected Python interpreter"
          assert os.environ["GITHUB_REPOSITORY"] == "kusennjp1-ai/screener"
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert os.environ["GITHUB_REF"] == "refs/heads/ordinary-prices-only-synthetic-check-a11-v6"
          assert os.environ["GITHUB_RUN_ATTEMPT"] == "1"
          assert not os.environ.get("GH_TOKEN") and not os.environ.get("GITHUB_TOKEN"), "Unexpected token in code-only job"
          base = "b464cd32691853b7128189f4e3350b74959468bb"
          workflow = ".github/workflows/ordinary-prices-only-synthetic-check.yml"
          pins = json.loads("{\"backend/app/scripts/export_static_site.py\":{\"blob\":\"74b8a15ac0d70cb1c3881eebc7da807c2a487526\",\"sha256\":\"92caa81bb450c4a654cb24c4429ac50445c01d6e5eea898d35dea85af71214a2\",\"bytes\":33691},\"backend/app/services/static_site_export_service.py\":{\"blob\":\"8517df226754ac302b50c7269f44db7cb6e30dcb\",\"sha256\":\"fb4535121eaf8832b383a98ae13edfc0926889877df272ffafd57c2a44fdfe45\",\"bytes\":137826},\"backend/tests/unit/test_export_static_site_script.py\":{\"blob\":\"fb110401a85bcfbf625eab63ee8c627e7fb3edcc\",\"sha256\":\"3d6b08fbde509216f7b2597017b0b7b5f37e632202b331c1496e23605209313c\",\"bytes\":53802},\"backend/tests/unit/test_static_site_export_service.py\":{\"blob\":\"2d0d0dae722a589d3cc1ad153635984f0e099cbf\",\"sha256\":\"dfb202a19ace16cfea608dcc05e7cd382c869474116c7439fe8f284a69ad9fbb\",\"bytes\":146076},\"backend/app/services/price_cache_service.py\":{\"blob\":\"f0c45718ccf27891f2223f207b5fe7e03a1d5712\",\"sha256\":\"88d2e67a5bf59920fc4a573f54fea78d0f4aa6447007f8a18a1564fddf79767c\",\"bytes\":92994},\"backend/app/services/static_daily_price_refresh_service.py\":{\"blob\":\"d0e3a258cf81a7cb01908286894514d8c14dba25\",\"sha256\":\"d3915762ee063d115bdb82c051a64f22ba52328dfd49bf28b95744dbeb0d8cfc\",\"bytes\":14308},\"backend/app/services/daily_price_bundle_service.py\":{\"blob\":\"102e2870d6117ec62987b7e97704ec939c98d2c9\",\"sha256\":\"2363747238b81b819fb1e3b8533ee796551cf6668c5b52c04e7982ed7c45cae2\",\"bytes\":25767},\"backend/tests/unit/test_price_cache_warmup_store.py\":{\"blob\":\"ee4522797ceeeb1806150559f33fabbbe3c95e00\",\"sha256\":\"c2cfe11f5685eedc84b71208aafe7172fbf07a6fa73555d6e3cc50ef4eed5bb5\",\"bytes\":13702},\"backend/tests/unit/test_static_daily_price_refresh_service.py\":{\"blob\":\"45db0c0eec08952b1f07f57e4c0f4bb5c46c7e03\",\"sha256\":\"dab76d766047bb1d0e4d82f3afeb43055d66d92bf7702471068d263b736b0456\",\"bytes\":25400},\"backend/tests/unit/test_daily_price_bundle_service.py\":{\"blob\":\"6b7580973680f27fd31890f4188ea89d3f45b5bf\",\"sha256\":\"043dae8a386fc212122a3c910a28e36dc1a1429e5a2448ad07e715e0ddd0a580\",\"bytes\":22000},\"backend/app/services/static_price_session_audit.py\":{\"blob\":\"6038dedff09a317dc1ec5f8a1a723a24596ad40c\",\"sha256\":\"e7a076266720c362b4e7125967bca95f9541963bf414d99222b604ffe2276ca3\",\"bytes\":9281},\"backend/tests/unit/test_static_price_session_audit.py\":{\"blob\":\"6d91b7e2ef44ca310176833fd6e661ab0b62638e\",\"sha256\":\"bf5bed0a31d005edf5b0a765327b0f56d2d9ac12d47b22c5972305efd4c33d64\",\"bytes\":10997},\"backend/tests/unit/test_price_session_ordinary_source_integration.py\":{\"blob\":\"d1a6a7b4200b3d637d9e147cd69e41dcbaecc1ce\",\"sha256\":\"c0083ffdd03b4ff6bd65a6a480d14887da4d2cc89440319e41aba61c69b3869c\",\"bytes\":37124},\".github/scripts/ordinary-publisher-tooling.mjs\":{\"blob\":\"4efc538d1804410bb213d9034ec497331df26fde\",\"sha256\":\"fbb1be053819166703ba1b044e6e9889690efece3ef129b8a61da6db70df6268\",\"bytes\":36056},\".github/scripts/ordinary-publisher-tooling.test.mjs\":{\"blob\":\"ecb746500bb54232b5bedb5c8550c65ae9dfedfc\",\"sha256\":\"18a0f1b0e72956677c3f9907ca65ac93759d3807080ff09c8e123243cd095386\",\"bytes\":25386},\".github/scripts/select-release-source.mjs\":{\"blob\":\"a3258686a38769e9d1263c0b33a89943df122843\",\"sha256\":\"f16c8c5e6b22b744a3dc4cd02e81c1a68876b5953d19ba2fae114ae69a8cbeb8\",\"bytes\":63092},\".github/scripts/publication-state.mjs\":{\"blob\":\"7ec98232233a434b558556061a692cdb4222b313\",\"sha256\":\"ead795549de5ed78c2ccbefdded05152f6e1c66f5fee8ec0093f5804424094f6\",\"bytes\":28665},\".github/workflows/research-ui-release.yml\":{\"blob\":\"0dc266577534275913b4daa23c229feb634c7511\",\"sha256\":\"3d5d60e06e34d2314f2dc298090e41780afecbc60bc8c2fc0f16dfbf43072197\",\"bytes\":21001},\"frontend/tools/publication-state.test.mjs\":{\"blob\":\"9bfdde7765e80093aab4c355bd5b62f579ee803f\",\"sha256\":\"c4d9b9ccd1b665aee81a13742204002813daf03f717787ed7bb249a27f7f983f\",\"bytes\":24015},\"frontend/tools/select-release-source.test.mjs\":{\"blob\":\"a3d1fbf790804563554969d7418de1e0ce73755d\",\"sha256\":\"361d0995535242df7b73f298947667a75431669090d59af5af9fa6219717d8cb\",\"bytes\":14299},\".github/workflows/ci.yml\":{\"blob\":\"6beee0d9e1d244661bd783c2af9b540399caf247\",\"sha256\":\"a7d6bd2019a72d4e0144d333bc4e981c60f6365e222be77abec3a986980e847b\",\"bytes\":19075}}")
          def git(*args):
              return subprocess.check_output(["git", *args], text=True, timeout=20).strip()
          assert git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"]
          assert git("show", "-s", "--format=%P", "HEAD") == base
          assert sorted(git("diff", "--name-only", base, "HEAD").splitlines()) == sorted([*pins, workflow])
          for path, pin in pins.items():
              raw = pathlib.Path(path).read_bytes()
              assert len(raw) == pin["bytes"], "Unexpected byte count: "+path
              assert hashlib.sha256(raw).hexdigest() == pin["sha256"], "Unexpected SHA256: "+path
              assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest() == pin["blob"], "Unexpected Git blob: "+path
          production_root = {}
          for record in subprocess.check_output(["git", "ls-tree", "-r", "-z", "HEAD"], timeout=20).split(b"\0"):
              if not record:
                  continue
              metadata, raw_path = record.split(b"\t", 1)
              if raw_path == workflow.encode():
                  continue
              mode, kind, object_sha = metadata.split(b" ", 2)
              assert kind == b"blob", "Unexpected production tree object type"
              parts = raw_path.split(b"/")
              branch = production_root
              for part in parts[:-1]:
                  branch = branch.setdefault(part, {})
              assert parts[-1] not in branch, "Duplicate production tree path"
              branch[parts[-1]] = (mode, object_sha)
          def tree_hash(branch):
              records = []
              for name, value in branch.items():
                  directory = isinstance(value, dict)
                  mode, object_sha = (b"40000", tree_hash(value).encode()) if directory else value
                  records.append((name + (b"/" if directory else b""), mode + b" " + name + b"\0" + bytes.fromhex(object_sha.decode())))
              raw = b"".join(record for _, record in sorted(records))
              return hashlib.sha1(b"tree " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          production_tree = tree_hash(production_root)
          assert production_tree == "2ab08ef7fc78045b152d53addcb59c9a2f73edbb", "Unexpected complete production tree"
          request_raw = pathlib.Path(".github/retained-price-oct6-source.json").read_bytes()
          assert hashlib.sha1(b"blob "+str(len(request_raw)).encode()+b"\0"+request_raw).hexdigest() == "3b2bc955ce66ba5a97e7dd9b3a5587c605b4350a"
          request = json.loads(request_raw)
          assert request["enabled"] is False and request["activation"] is None
          node = subprocess.check_output(["node", "--version"], text=True, timeout=10).strip()
          assert node == "v22.23.3"
          print(json.dumps({"code_only":True,"head":os.environ["GITHUB_SHA"],"base":base,"files":len(pins),"production_tree":production_tree,"node":node,"python":sys.version.split()[0],"request_disabled":True}))
          PY
      - name: Install the existing normal-CI backend requirements
        id: dependencies
        timeout-minutes: 12
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Compile exact changed Python source and install the test network boundary
        id: compile
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, py_compile
          for path in ["backend/app/scripts/export_static_site.py","backend/app/services/static_site_export_service.py","backend/tests/unit/test_export_static_site_script.py","backend/tests/unit/test_static_site_export_service.py","backend/app/services/price_cache_service.py","backend/app/services/static_daily_price_refresh_service.py","backend/app/services/daily_price_bundle_service.py","backend/tests/unit/test_price_cache_warmup_store.py","backend/tests/unit/test_static_daily_price_refresh_service.py","backend/tests/unit/test_daily_price_bundle_service.py","backend/app/services/static_price_session_audit.py","backend/tests/unit/test_static_price_session_audit.py","backend/tests/unit/test_price_session_ordinary_source_integration.py"]:
              py_compile.compile(path, doraise=True)
          PY
          mkdir "$RUNNER_TEMP/prices-only-network-guard"
          cat > "$RUNNER_TEMP/prices-only-network-guard/sitecustomize.py" <<'PY'
          import ipaddress
          import socket
          import os
          
          _BLOCK_LOG = os.environ.get("PRICES_ONLY_NETWORK_GUARD_LOG")
          
          def _blocked():
              if _BLOCK_LOG:
                  with open(_BLOCK_LOG, "a", encoding="ascii") as stream:
                      stream.write("blocked\n")
              raise RuntimeError("Code-only synthetic tests blocked a live network operation")
          
          _ALLOWED_NAMES = {"localhost"}
          _original_getaddrinfo = socket.getaddrinfo
          _original_connect = socket.socket.connect
          _original_connect_ex = socket.socket.connect_ex
          
          
          def _allowed(host):
              if isinstance(host, bytes):
                  host = host.decode("ascii", "strict")
              if host in _ALLOWED_NAMES:
                  return True
              try:
                  return ipaddress.ip_address(host).is_loopback
              except (ValueError, TypeError):
                  return False
          
          
          def _checked(host):
              if not _allowed(host):
                  _blocked()
          
          
          def _getaddrinfo(host, *args, **kwargs):
              _checked(host)
              return _original_getaddrinfo(host, *args, **kwargs)
          
          
          def _connect(sock, address):
              if sock.family in (socket.AF_INET, socket.AF_INET6):
                  _checked(address[0])
              return _original_connect(sock, address)
          
          
          def _connect_ex(sock, address):
              if sock.family in (socket.AF_INET, socket.AF_INET6):
                  _checked(address[0])
              return _original_connect_ex(sock, address)
          
          
          socket.getaddrinfo = _getaddrinfo
          socket.socket.connect = _connect
          socket.socket.connect_ex = _connect_ex
          
          # curl_cffi uses native libcurl sockets, so Python socket wrappers alone do not
          # constrain it. These suites require mocked HTTP; reject native HTTP before I/O.
          try:
              from curl_cffi import requests as _curl_requests
          except ImportError:
              _curl_requests = None
          if _curl_requests is not None:
              def _curl_request(*args, **kwargs):
                  _blocked()
              async def _curl_async_request(*args, **kwargs):
                  _blocked()
              _curl_requests.Session.request = _curl_request
              if hasattr(_curl_requests, "AsyncSession"):
                  _curl_requests.AsyncSession.request = _curl_async_request
          PY
      - name: Execute the exact permanent Backend price-session step
        id: ci-contract
        timeout-minutes: 8
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          export PRICES_ONLY_NETWORK_GUARD_LOG="$RUNNER_TEMP/prices-only-network-blocked.log"
          export PYTHONPATH="$RUNNER_TEMP/prices-only-network-guard:$GITHUB_WORKSPACE/backend${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          import json, os, pathlib, subprocess, yaml
          ci = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".github/workflows/ci.yml"
          document = yaml.safe_load(ci.read_text(encoding="utf-8"))
          steps = document["jobs"]["backend"]["steps"]
          node_steps = [step for step in steps if step.get("uses") == "actions/setup-node@v4"]
          assert len(node_steps) == 1 and node_steps[0]["with"]["node-version"] == "22.23.3"
          selected = [step for step in steps if step.get("id") == "price-session-contract"]
          assert len(selected) == 1, "Permanent Backend contract step is missing or duplicated"
          step = selected[0]
          assert step["timeout-minutes"] == 8 and step["working-directory"] == "backend"
          expected = {"LITELLM_LOCAL_MODEL_COST_MAP":"true", "STOCKSCANNER_TEST_ALLOW_POSTGRES":"0", "STOCKSCANNER_TEST_USE_DATABASE_URL":"0", "STOCKSCANNER_TEST_ALLOW_SQLITE":"1", "DATABASE_URL":"sqlite://", "STATIC_SITE_CODE33":"0"}
          assert step["env"] == expected, "Permanent Backend test environment changed"
          script = pathlib.Path(os.environ["RUNNER_TEMP"]) / "permanent-backend-price-session.sh"
          script.write_text(step["run"], encoding="utf-8")
          env = {**os.environ, **expected}
          subprocess.run(["bash", str(script)], cwd=os.getcwd(), env=env, check=True, timeout=450)
          print(json.dumps({"scope":"executed_permanent_backend_price_session_step", "full_ci":False, "browser":False, "deployment":False, "actual_data_proof":False}))
          PY
      - name: Require complete focused CI and zero live-network attempts
        env:
          CI_CONTRACT_OUTCOME: ${{ steps.ci-contract.outcome }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          assert os.environ["CI_CONTRACT_OUTCOME"] == "success", "Permanent Backend step did not pass"
          root = ET.parse(pathlib.Path(os.environ["RUNNER_TEMP"]) / "backend-price-session-contract.xml").getroot()
          cases = list(root.iter("testcase"))
          assert cases and not list(root.iter("failure")) and not list(root.iter("error"))
          parity = [case for case in cases if case.get("name") == "test_exact_approved_javascript_audit_and_liquid_predicate_parity"]
          assert len(parity) == 1 and all(parity[0].find(tag) is None for tag in ("skipped", "failure", "error"))
          expected = {f"test_ordinary_price_session_compiler_contract[{case}]" for case in ("later-missing", "later-duplicate", "same-missing", "same-duplicate")}
          integration = [case for case in cases if case.get("name", "").startswith("test_ordinary_price_session_compiler_contract[")]
          assert len(integration) == 4 and {case.get("name") for case in integration} == expected
          assert all(case.find(tag) is None for case in integration for tag in ("skipped", "failure", "error"))
          blocked = pathlib.Path(os.environ["RUNNER_TEMP"]) / "prices-only-network-blocked.log"
          assert not blocked.exists() or blocked.stat().st_size == 0, "Live network attempt in focused CI"
          print(json.dumps({"code_only":True, "scope":"executed_permanent_backend_price_session_step", "tests":len(cases), "compiler_integration_cases":len(integration), "approved_js_parity":"passed", "network_attempts":0, "full_ci":False, "browser":False, "deployment":False, "actual_data_proof":False, "publication_authority":False}))
          PY
