name: Finite conditional reader request ceiling code checks
on:
  push:
    branches: [finite-conditional-reader-cap-code-a13-v1]
permissions:
  contents: read
concurrency:
  group: finite-conditional-reader-cap-code-a13-v1
  cancel-in-progress: false
jobs:
  code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Bind isolated code-only context
        id: preflight
        timeout-minutes: 2
        env:
          EXPECTED_CODE_TREE: 'a0144ceee80833131912d13c3aef41002b7da256'
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = kusennjp1-ai/screener
          test "$GITHUB_REPOSITORY_ID" = 1203919607
          test "$GITHUB_REF" = refs/heads/finite-conditional-reader-cap-code-a13-v1
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA 2e289c42c00e0d0bad05263ab8273a257dc0ae8e"
          test "$(git rev-parse 'HEAD^1^{tree}')" = 'e22ddee3121979d0ef805601cd9f7265f79fc643'
          test "$(git rev-parse HEAD:.github/retained-price-oct6-source.json)" = 3b2bc955ce66ba5a97e7dd9b3a5587c605b4350a
          test "$(git rev-parse HEAD:.github/scripts/conditional-deployment-jobs-worker.mjs)" = 265ede759b1714c882015c696c6fac66975ae03a
          test "$(git rev-parse HEAD:.github/scripts/conditional-deployment-jobs-worker.test.mjs)" = 279e26e6188484ec300244892acb4ffa3fd5ac00
          test ! -e .github/scripts/conditional-deployment-jobs-cache.mjs
          test ! -e .github/scripts/conditional-deployment-jobs.mjs
          test ! -e .github/scripts/measure-conditional-deployment-jobs-budget.mjs
          GIT_INDEX_FILE="$RUNNER_TEMP/conditional-reader-cap-index" git read-tree HEAD
          GIT_INDEX_FILE="$RUNNER_TEMP/conditional-reader-cap-index" git update-index --force-remove .github/workflows/finite-conditional-reader-cap-code-a13.yml
          test "$(GIT_INDEX_FILE="$RUNNER_TEMP/conditional-reader-cap-index" git write-tree)" = "$EXPECTED_CODE_TREE"
          test "$(node --version)" = v22.23.3
          node --check .github/scripts/conditional-deployment-jobs-worker.mjs
          node --check .github/scripts/conditional-deployment-jobs-worker.test.mjs
          printf 'Two inert reader files verified; original disabled production tree retained.\n'
      - name: Native request ceiling and complete proof contracts
        id: native
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          node --test --test-concurrency=1 --test-reporter=tap .github/scripts/conditional-deployment-jobs-worker.test.mjs | tee "$RUNNER_TEMP/conditional-reader-cap.tap"
          node --input-type=module - "$RUNNER_TEMP/conditional-reader-cap.tap" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8');
          for (const [field, expected] of Object.entries({tests:46,pass:46,fail:0,cancelled:0,skipped:0,todo:0})) {
            const matches = [...text.matchAll(new RegExp('^# ' + field + ' ([0-9]+)$', 'gm'))];
            assert.equal(matches.length, 1, field + ' must be reported once');
            assert.equal(Number(matches[0][1]), expected, field);
          }
          console.log('exact native outcome: 46 passed; zero failures, skips, cancellations or todo');
          NODE
      - name: State complete diagnostic scope
        if: ${{ always() }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
        run: |
          set -euo pipefail
          test -z "${GH_TOKEN:-}"
          test -z "${GITHUB_TOKEN:-}"
          printf 'stage outcomes preflight=%s native=%s\n' "$PREFLIGHT_OUTCOME" "$NATIVE_OUTCOME"
          test "$PREFLIGHT_OUTCOME" = success
          test "$NATIVE_OUTCOME" = success
          printf 'Synthetic optional request-ceiling contracts passed. Production integration, live metadata, full API budget and release acceptance remain pending.\n'
