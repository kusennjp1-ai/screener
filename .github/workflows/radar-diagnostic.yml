name: Radar Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node tools/build-radar-benchmark.mjs
        working-directory: frontend
      - run: node tools/radar-diagnostic.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-diagnostic-${{ github.sha }}
          path: frontend/test-results/radar-diagnostic/
          retention-days: 7
