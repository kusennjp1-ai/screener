name: Static Site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Automatic acquisitions are admitted by the serialized post-close watchdog.
  workflow_dispatch:
    inputs:
      market_group:
        description: 'Which market group to build'
        type: choice
        default: all
        options:
          - all
          - asia
          - us
      prices_only:
        description: 'Refresh price cache only (public date stays at existing scan)'
        type: boolean
        default: false

concurrency:
  # All acquisitions share one queue so manual maintenance cannot race a full
  # build. The watchdog admits automatic work only when no producer is active.
  group: ${{ github.event_name == 'workflow_run' && format('static-site-oct6-{0}', github.event.workflow_run.head_sha) || format('static-site-{0}', github.ref) }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  select-markets:
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      repair: ${{ steps.price-route.outputs.repair }}
      markets: ${{ steps.pick.outputs.markets }}
      mode: ${{ steps.pick.outputs.mode }}
      source_promotion: ${{ steps.source-policy.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: github.event_name == 'workflow_run'
        with:
          node-version: '22'
      - name: Admit only the finite exact-main price CI trigger
        id: price-route
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retained-price-ci-admission.mjs producer-route
      - id: source-policy
        if: github.event_name != 'workflow_run'
        run: |
          python - <<'PY'
          import json, os
          policy = json.load(open('.github/daily-price-promotion.json'))
          assert policy['schema_version'] == 'daily-price-promotion-rollout-v1'
          assert type(policy['enabled']) is bool
          assert policy['pointer_ref'] == 'data/daily-price-pointers'
          assert policy['pointer_path'] == 'daily-price-latest-us.json'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"enabled={str(policy['enabled']).lower()}\n")
          PY
      # Automatic calls arrive from the watchdog as explicit US full dispatches.
      # Manual groups retain their own requested markets and fallback handling.
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          MARKET_GROUP: ${{ github.event.inputs.market_group }}
          PRICES_ONLY: ${{ github.event.inputs.prices_only }}
          PRICE_REPAIR: ${{ steps.price-route.outputs.repair }}
        run: |
          ASIA='["HK","IN","JP","KR","TW","CN","SG","MY","AU"]'
          US='["US"]'
          ALL='["US"]'

          mode="full"
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            markets='[]'
            mode="noop"
            if [ "$PRICE_REPAIR" = "true" ]; then
              markets="$US"
              mode="offline_repair"
            fi
          else
            case "$MARKET_GROUP" in
              asia) markets="$ASIA" ;;
              us)   markets="$US" ;;
              *)    markets="$ALL" ;;
            esac
            if [ "$PRICES_ONLY" = "true" ]; then
              mode="prices_only"
              markets="$US"   # manual cache refresh is US-scoped
            fi
          fi

          echo "markets=$markets" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Building markets: $markets (mode: $mode)"

      # Positive event-bound evidence only; this no-op cannot acquire or publish.
      - name: "Ordinary no-export CI ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }}/${{ github.event.workflow_run.head_sha }}"
        if: ${{ github.event_name == 'workflow_run' && steps.price-route.outputs.repair == 'false' && steps.pick.outputs.mode == 'noop' && steps.pick.outputs.markets == '[]' }}
        run: ':'

  ensure_daily_price_release:
    needs: select-markets
    if: ${{ github.event_name != 'workflow_run' && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure daily price release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daily-price-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create daily-price-data \
            --repo "${{ github.repository }}" \
            --title "Daily Price Data" \
            --notes "Automated daily market-scoped OHLCV bundles for runtime bootstrap and refresh."

  build-market:
    if: ${{ github.event_name != 'workflow_run' && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    needs: [select-markets, ensure_daily_price_release]
    outputs:
      produced_candidate: ${{ steps.candidate-produced.outputs.produced }}
      source_candidate_id: ${{ matrix.market == 'US' && steps.source-candidate.outputs.artifact-id || '' }}
      source_candidate_digest: ${{ matrix.market == 'US' && steps.source-candidate.outputs.artifact-digest || '' }}
      source_producer_attempt: ${{ steps.source-candidate-record.outputs.producer_attempt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.select-markets.outputs.markets) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockscanner
          POSTGRES_USER: stockscanner
          POSTGRES_PASSWORD: stockscanner
        options: >-
          --health-cmd "pg_isready -U stockscanner -d stockscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner
      # IN-specific yfinance throttle: smaller batches + 10s between batches to
      # stay under Yahoo's 429 window for the ~4.4k IN universe. Other markets
      # ignore these (the policy looks up settings.<provider>_<key>_<market>).
      YFINANCE_BATCH_SIZE_IN: "25"
      YFINANCE_BATCH_RATE_LIMIT_IN: "0.1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-runtime.txt

      - name: Capture reviewed US source predecessor before collection
        if: ${{ matrix.market == 'US' && needs.select-markets.outputs.source_promotion == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.stage_daily_price_source capture \
            --repository "${{ github.repository }}" \
            --capture /tmp/daily-price-promotion/previous.json
          echo 'GITHUB_DAILY_PRICE_POINTER_REF=data/daily-price-pointers' >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          value = json.load(open('/tmp/daily-price-promotion/previous.json'))['manifest_sha256']
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'GITHUB_DAILY_PRICE_POINTER_EXPECTED_SHA256={value}\n')
          PY

      - name: Select weekly reference manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/weekly-reference
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          echo "MARKET_LOWER=${MARKET_LOWER}" >> "$GITHUB_ENV"
          MARKET_MANIFEST="weekly-reference-latest-${MARKET_LOWER}.json"
          LEGACY_MANIFEST="weekly-reference-latest.json"

          retry_download() {
            asset_name="$1"
            for attempt in 1 2 3; do
              rm -f "/tmp/weekly-reference/${asset_name}"
              if gh release download weekly-reference-data \
                --pattern "${asset_name}" \
                --dir /tmp/weekly-reference >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          retry_list_assets() {
            for attempt in 1 2 3; do
              if gh release view weekly-reference-data --json assets --jq '.assets[].name'; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          if ! ASSET_NAMES="$(retry_list_assets)"; then
            echo "Failed to list weekly-reference release assets for ${MARKET_LOWER}." >&2
            exit 1
          fi

          if printf '%s\n' "${ASSET_NAMES}" | grep -Fxq "${MARKET_MANIFEST}"; then
            retry_download "${MARKET_MANIFEST}"
            echo "WEEKLY_REFERENCE_MODE=market_scoped" >> "$GITHUB_ENV"
            echo "WEEKLY_REFERENCE_MANIFEST=/tmp/weekly-reference/${MARKET_MANIFEST}" >> "$GITHUB_ENV"
          elif [ "${{ matrix.market }}" = "US" ] && printf '%s\n' "${ASSET_NAMES}" | grep -Fxq "${LEGACY_MANIFEST}"; then
            retry_download "${LEGACY_MANIFEST}"
            echo "WEEKLY_REFERENCE_MODE=legacy" >> "$GITHUB_ENV"
            echo "WEEKLY_REFERENCE_MANIFEST=/tmp/weekly-reference/${LEGACY_MANIFEST}" >> "$GITHUB_ENV"
          else
            echo "No market-scoped weekly reference manifest found for ${MARKET_LOWER}." >&2
            exit 1
          fi

      - name: Download weekly reference bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry_download() {
            asset_name="$1"
            for attempt in 1 2 3; do
              rm -f "/tmp/weekly-reference/${asset_name}"
              if gh release download weekly-reference-data \
                --pattern "${asset_name}" \
                --dir /tmp/weekly-reference >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          export BUNDLE_ASSET_NAME="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["WEEKLY_REFERENCE_MANIFEST"]).read_text(encoding="utf-8"))
          print(manifest["bundle_asset_name"])
          PY
          )"
          export BUNDLE_SHA256="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["WEEKLY_REFERENCE_MANIFEST"]).read_text(encoding="utf-8"))
          print(manifest["sha256"])
          PY
          )"

          retry_download "$BUNDLE_ASSET_NAME"

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          bundle_path = Path("/tmp/weekly-reference") / os.environ["BUNDLE_ASSET_NAME"]
          digest = hashlib.sha256(bundle_path.read_bytes()).hexdigest()
          expected = os.environ["BUNDLE_SHA256"]
          if digest != expected:
              raise SystemExit(
                  f"Weekly reference bundle checksum mismatch for {bundle_path.name}: "
                  f"{digest} != {expected}"
              )
          print(bundle_path)
          PY

          echo "WEEKLY_REFERENCE_BUNDLE=/tmp/weekly-reference/${BUNDLE_ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Import weekly reference bundle
        run: |
          cd backend
          python -m app.scripts.import_weekly_reference_bundle \
            --input "${WEEKLY_REFERENCE_BUNDLE}"

      - name: Load tracked IBD industry seed
        run: |
          cd backend
          python -m app.scripts.load_ibd_industry_groups \
            --csv ../data/IBD_industry_group.csv

      # Fills IBD groups for symbols/markets the curated CSV doesn't cover (new
      # listings, non-US markets) without overwriting CSV/manual rows. Additive
      # and non-fatal: if the classification release isn't published yet, the
      # build proceeds with CSV-only coverage.
      - name: Apply IBD classification (fills gaps beyond the CSV seed)
        continue-on-error: true
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.sync_ibd_classification_from_github \
            --market "${{ matrix.market }}" \
            --allow-stale

      - name: Seed daily price bundle from GitHub
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
          # The pointer and bundle must use the same repository as the captured
          # predecessor; the backend's legacy default points at the upstream fork.
          GITHUB_DATA_REPOSITORY: ${{ matrix.market == 'US' && needs.select-markets.outputs.source_promotion == 'true' && github.repository || 'xang1234/stock-screener' }}
        run: |
          cd backend
          python -m app.scripts.sync_daily_price_bundle_from_github \
            --market "${{ matrix.market }}" \
            --allow-stale

      # Fast prices-only runs re-export against the latest PUBLISHED feature
      # run, but this job's database is fresh — seed the run from the bundle
      # the previous full build uploaded. Without it the export exits 79 and
      # the combine job just republishes yesterday's site.
      - name: Seed feature run bundle from GitHub (fast mode)
        if: ${{ needs.select-markets.outputs.mode == 'prices_only' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/feature-run
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          for attempt in 1 2 3; do
            if gh release download daily-price-data \
              --pattern "feature-run-latest-${MARKET_LOWER}.json" \
              --dir /tmp/feature-run --clobber; then
              break
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          if [ ! -f "/tmp/feature-run/feature-run-latest-${MARKET_LOWER}.json" ]; then
            echo "No feature-run manifest published yet; the export will exit 79 and combine falls back." >&2
            exit 0
          fi
          BUNDLE_ASSET="$(python -c "import json;print(json.load(open('/tmp/feature-run/feature-run-latest-${MARKET_LOWER}.json'))['bundle_asset_name'])")"
          for attempt in 1 2 3; do
            if gh release download daily-price-data \
              --pattern "$BUNDLE_ASSET" \
              --dir /tmp/feature-run --clobber; then
              break
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done
          cd backend
          python -m app.scripts.import_feature_run_bundle \
            --input "/tmp/feature-run/${BUNDLE_ASSET}"

      - name: Export market static data bundle
        id: export-market
        env:
          # Compute Code 33 (relaxed Minervini earnings acceleration) live from
          # SEC EDGAR XBRL for US passes_template candidates. EDGAR is US-only
          # and needs outbound data.sec.gov access, available here. Non-US
          # markets ignore this flag.
          STATIC_SITE_CODE33: "1"
        run: |
          cd backend
          set +e
          if [ "${{ needs.select-markets.outputs.mode }}" = "prices_only" ]; then
            # Manual cache refresh; chart export remains capped at the existing scan.
            python -m app.scripts.export_static_site \
              --output-dir /tmp/static-data \
              --prices-only \
              --market "${{ matrix.market }}"
          else
            python -m app.scripts.export_static_site \
              --output-dir /tmp/static-data \
              --refresh-daily \
              --build-mode price_delta \
              --skip-universe-refresh \
              --skip-fundamentals-refresh \
              --market "${{ matrix.market }}"
          fi
          status=$?
          set -e
          if [ "$status" -eq 78 ]; then
            echo "Market ${{ matrix.market }} is not a trading day; no current static artifact will be uploaded."
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 79 ]; then
            echo "Market ${{ matrix.market }} produced diagnostics but no current market artifact will be uploaded; combine will use fallback artifacts if available."
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "has_artifact=true" >> "$GITHUB_OUTPUT"

      - name: Measure IBD-50 overlap (US)
        # Weekly calibration loop: compare the freshly-built US Composite-Rating
        # leadership list against IBD's published leaders (data/ibd_reference/)
        # and write the overlap to the job summary. Read-only and
        # continue-on-error so it can never affect the published build.
        if: ${{ matrix.market == 'US' && steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode != 'prices_only' }}
        continue-on-error: true
        run: |
          cd backend
          python -m app.scripts.ibd_overlap_report_from_db --market US --calibrate

      - name: Diagnose IBD-50 reference (US)
        # Per-name diagnosis: for each IBD leader, show the screener's ratings
        # and which IBD-50 gate (if any) excludes it — so low overlap can be
        # traced to gates vs missing data vs ranking. Read-only / non-blocking.
        if: ${{ matrix.market == 'US' && steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode != 'prices_only' }}
        continue-on-error: true
        run: |
          cd backend
          python -m app.scripts.ibd_diagnose_reference --market US

      - name: Upload market diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: static-market-diagnostics-${{ matrix.market }}
          path: /tmp/static-data/diagnostics/${{ env.MARKET_LOWER }}
          if-no-files-found: ignore

      - name: Build daily price bundle
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode == 'full' }}
        run: |
          cd backend
          COVERAGE_ARGS=()
          if [ "${{ matrix.market }}" = US ] && [ "${{ needs.select-markets.outputs.source_promotion }}" = true ]; then
            COVERAGE_FLOOR=$(python - <<'PY'
          import json, math
          previous = json.load(open('/tmp/daily-price-promotion/previous.json'))['manifest']
          floor = previous.get('min_symbol_coverage')
          if floor is None and previous.get('require_complete') is True:
              floor = 1.0
          assert type(floor) in (int, float) and math.isfinite(floor) and 0 < floor <= 1
          assert previous.get('allow_stale_complete') is False
          assert previous.get('required_cohort') and previous.get('required_cohort_sha256')
          print(floor)
          PY
            )
            COVERAGE_ARGS=(--require-complete --min-symbol-coverage "$COVERAGE_FLOOR")
          fi
          python -m app.scripts.build_daily_price_bundle \
            --market "${{ matrix.market }}" \
            --output-dir /tmp/daily-price "${COVERAGE_ARGS[@]}"

      # Collection output is a candidate only. The source pointer is updated by
      # the serialized final job after downstream date/price/cohort validation.
      - name: Record the actual US candidate producer attempt
        id: source-candidate-record
        if: ${{ matrix.market == 'US' && steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode == 'full' }}
        run: |
          cd backend
          python -m app.scripts.daily_price_artifact_provenance record --role candidate \
            --root /tmp --record /tmp/daily-price-promotion/producer.json
      - name: Preserve daily source candidate and exact predecessor
        id: source-candidate
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-source-candidate-${{ matrix.market }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/daily-price
            /tmp/daily-price-promotion
          if-no-files-found: error
          retention-days: 7

      - name: Record that a US source candidate was actually produced
        id: candidate-produced
        if: ${{ matrix.market == 'US' && steps.source-candidate.outputs.artifact-id != '' }}
        run: echo 'produced=true' >> "$GITHUB_OUTPUT"

      - name: Preserve existing non-US source publication behavior
        if: ${{ matrix.market != 'US' && steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_PATH="$(find /tmp/daily-price -maxdepth 1 -name "daily-price-${MARKET_LOWER}-*.json.gz" -print -quit)"
          MANIFEST_PATH="/tmp/daily-price/daily-price-latest-${MARKET_LOWER}.json"
          test -n "$BUNDLE_PATH" && test -f "$MANIFEST_PATH"
          gh release upload daily-price-data "$BUNDLE_PATH" --clobber
          gh release upload daily-price-data "$MANIFEST_PATH" --clobber

      # Retain the feature run for manual maintenance; prices-only exports
      # remain capped at this published snapshot date.
      - name: Upload feature run bundle (full mode)
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && needs.select-markets.outputs.mode != 'prices_only' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          cd backend
          python -m app.scripts.build_feature_run_bundle \
            --market "${{ matrix.market }}" \
            --output-dir /tmp/feature-run-out
          cd ..
          BUNDLE_PATH="$(find /tmp/feature-run-out -maxdepth 1 -name "feature-run-${MARKET_LOWER}-*.json.gz" | head -n 1)"
          MANIFEST_PATH="/tmp/feature-run-out/feature-run-latest-${MARKET_LOWER}.json"
          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$MANIFEST_PATH" ]; then
            echo "Missing feature-run bundle outputs" >&2
            exit 1
          fi
          gh release upload daily-price-data "$BUNDLE_PATH" --clobber
          gh release upload daily-price-data "$MANIFEST_PATH" --clobber

      - name: Upload market artifact
        if: ${{ steps.export-market.outputs.has_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: static-market-${{ matrix.market }}
          path: /tmp/static-data/markets/${{ env.MARKET_LOWER }}
          if-no-files-found: error

  combine-and-build:
    # Preserve fallback after failure or a skip, but not after cancellation.
    if: ${{ !cancelled() && ((github.event_name == 'workflow_run' && needs.select-markets.result == 'success' && needs.select-markets.outputs.repair == 'true') || (github.event_name != 'workflow_run' && needs.build-market.result != 'cancelled' && (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))) }}
    needs: [select-markets, build-market]
    timeout-minutes: ${{ needs.select-markets.outputs.repair == 'true' && 110 || 360 }}
    permissions:
      contents: read
      actions: read
    outputs:
      downstream_artifact_id: ${{ steps.source-downstream.outputs.artifact-id }}
      downstream_artifact_digest: ${{ steps.source-downstream.outputs.artifact-digest }}
      downstream_producer_attempt: ${{ steps.source-downstream-record.outputs.producer_attempt }}
    runs-on: ubuntu-latest
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner

    steps:
      - name: Record first producer step clock
        if: needs.select-markets.outputs.repair == 'true'
        run: date +%s > "$RUNNER_TEMP/retained-price-source-job-start"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ needs.select-markets.outputs.repair == 'true' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: needs.select-markets.outputs.repair != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - uses: actions/setup-python@v5
        if: needs.select-markets.outputs.repair == 'true'
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: needs.select-markets.outputs.repair != 'true'
        run: pip install -r backend/requirements-runtime.txt

      - name: Install frontend dependencies
        if: needs.select-markets.outputs.repair != 'true'
        run: cd frontend && npm ci

      - name: Prepare pinned finite price arithmetic runtime
        if: needs.select-markets.outputs.repair == 'true'
        run: |
          python3.11 -m venv "$RUNNER_TEMP/retained-price-python"
          "$RUNNER_TEMP/retained-price-python/bin/python3.11" -m pip install numpy==1.26.3 pandas==2.2.0
          echo "RETAINED_PRICE_PYTHON=$RUNNER_TEMP/retained-price-python/bin/python3.11" >> "$GITHUB_ENV"

      - name: Download current market artifacts
        if: needs.select-markets.outputs.repair != 'true'
        id: download-market-artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: static-market-*
          path: /tmp/static-market-artifacts-current
          merge-multiple: false

      - name: Download per-market fallback artifacts
        if: needs.select-markets.outputs.repair != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.ref_name }}
          REQUESTED_MARKETS: ${{ needs.select-markets.outputs.markets }}
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urlencode

          repo = os.environ["REPOSITORY"]
          current_run_id = int(os.environ["CURRENT_RUN_ID"])
          branch_name = os.environ["BRANCH_NAME"]
          expected_markets = {value.strip().upper() for value in os.environ.get("STATIC_SITE_MARKETS", "US").split(",") if value.strip()}
          requested_markets = json.loads(os.environ.get("REQUESTED_MARKETS", "[]"))
          if not isinstance(requested_markets, list) or any(not isinstance(value, str) for value in requested_markets):
              raise ValueError("Invalid requested market set")
          expected_markets.update(value.upper() for value in requested_markets)
          if not expected_markets:
              raise ValueError("Expected market set is empty")
          current_dir = Path("/tmp/static-market-artifacts-current")
          fallback_dir = Path("/tmp/static-market-artifacts-fallback")
          fallback_dir.mkdir(parents=True, exist_ok=True)
          query = urlencode(
              {
                  "branch": branch_name,
                  "status": "completed",
                  "per_page": "100",
              }
          )

          def warn(message):
              print(
                  f"::warning::Unable to download fallback market artifact: {message}",
                  flush=True,
              )

          def command_error_detail(exc, limit=800):
              details = []
              for stream_name, stream_value in (("stderr", exc.stderr), ("stdout", exc.stdout)):
                  text = (stream_value or "").strip()
                  if not text:
                      continue
                  text = " | ".join(text.splitlines())
                  if len(text) > limit:
                      text = f"{text[:limit]}..."
                  details.append(f"{stream_name}: {text}")
              return f" Details: {'; '.join(details)}" if details else ""

          def market_from_artifact_name(artifact_name):
              prefix = "static-market-"
              market = artifact_name[len(prefix):] if artifact_name.startswith(prefix) else ""
              # Exact requested-market names exclude diagnostics and unrelated exports.
              return market if market in expected_markets else ""

          def extract_runs(payload):
              if isinstance(payload, dict):
                  workflow_runs = payload.get("workflow_runs")
                  if not isinstance(workflow_runs, list):
                      raise ValueError(
                          "Unexpected GitHub API response shape: workflow_runs is not a list."
                      )
                  return [run for run in workflow_runs if isinstance(run, dict)]

              if isinstance(payload, list):
                  runs = []
                  for page in payload:
                      if not isinstance(page, dict):
                          raise ValueError(
                              "Unexpected GitHub API response shape: page is not an object."
                          )
                      workflow_runs = page.get("workflow_runs", [])
                      if not isinstance(workflow_runs, list):
                          raise ValueError(
                              "Unexpected GitHub API response shape: workflow_runs is not a list."
                          )
                      runs.extend(run for run in workflow_runs if isinstance(run, dict))
                  return runs

              raise ValueError(
                  "Unexpected GitHub API response shape: response is not an object or list."
              )

          def collect_current_markets():
              current_markets = set()
              metadata_paths = (
                  sorted(current_dir.rglob("manifest.market.json"))
                  if current_dir.exists()
                  else []
              )
              for metadata_path in metadata_paths:
                  try:
                      payload = json.loads(metadata_path.read_text(encoding="utf-8"))
                      market = str(payload.get("market", "")).upper()
                  except (OSError, json.JSONDecodeError, TypeError) as exc:
                      warn(f"Current artifact metadata at {metadata_path} could not be read ({exc}).")
                      continue
                  if market in expected_markets and payload.get("schema_version") == "static-site-v2" and isinstance(payload.get("entry"), dict):
                      current_markets.add(market)
              return current_markets

          def extract_artifacts(payload):
              if isinstance(payload, dict):
                  artifacts = payload.get("artifacts")
                  if not isinstance(artifacts, list):
                      raise ValueError(
                          "Unexpected GitHub API response shape: artifacts is not a list."
                      )
                  return [artifact for artifact in artifacts if isinstance(artifact, dict)]

              if isinstance(payload, list):
                  artifacts = []
                  for page in payload:
                      if not isinstance(page, dict):
                          raise ValueError(
                              "Unexpected GitHub API response shape: page is not an object."
                          )
                      page_artifacts = page.get("artifacts", [])
                      if not isinstance(page_artifacts, list):
                          raise ValueError(
                              "Unexpected GitHub API response shape: artifacts is not a list."
                          )
                      artifacts.extend(
                          artifact for artifact in page_artifacts if isinstance(artifact, dict)
                      )
                  return artifacts

              raise ValueError(
                  "Unexpected GitHub API response shape: response is not an object or list."
              )

          def gh_json(args):
              result = subprocess.run(
                  ["gh", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(result.stdout)

          current_markets = collect_current_markets()
          fallback_markets = set()
          if expected_markets <= current_markets:
              print("Current run covers all required/requested markets; no fallback API calls needed.", flush=True)
              sys.exit(0)

          try:
              pages = gh_json(
                  [
                      "api",
                      "--paginate",
                      "--slurp",
                      f"repos/{repo}/actions/workflows/static-site.yml/runs?{query}",
                  ]
              )
              runs = extract_runs(pages)
          except subprocess.CalledProcessError as exc:
              warn(
                  "GitHub workflow runs API request failed "
                  f"with exit {exc.returncode}.{command_error_detail(exc)}"
              )
              runs = []
          except json.JSONDecodeError as exc:
              warn(f"GitHub workflow runs API response was not valid JSON ({exc}).")
              runs = []
          except (AttributeError, KeyError, TypeError, ValueError) as exc:
              warn(str(exc))
              runs = []

          if current_markets:
              print(
                  f"Current run already has market artifacts: {', '.join(sorted(current_markets))}.",
                  flush=True,
              )

          for run in runs:
              if expected_markets <= current_markets | fallback_markets:
                  break
              run_id = run.get("id")
              if run_id == current_run_id:
                  continue
              try:
                  artifact_pages = gh_json(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
                      ]
                  )
                  artifacts = extract_artifacts(artifact_pages)
              except subprocess.CalledProcessError as exc:
                  warn(
                      f"Artifact list API request for run {run_id} failed "
                      f"with exit {exc.returncode}.{command_error_detail(exc)}"
                  )
                  continue
              except json.JSONDecodeError as exc:
                  warn(f"Artifact list API response for run {run_id} was not valid JSON ({exc}).")
                  continue
              except (AttributeError, KeyError, TypeError, ValueError) as exc:
                  warn(f"Artifact list API response for run {run_id} was invalid: {exc}")
                  continue

              artifacts_by_name = {
                  str(artifact.get("name")): artifact
                  for artifact in artifacts
                  if not artifact.get("expired")
              }

              for artifact_name in sorted(artifacts_by_name):
                  market = market_from_artifact_name(artifact_name)
                  if not market:
                      continue
                  if market in current_markets or market in fallback_markets:
                      continue

                  target_dir = fallback_dir / artifact_name
                  if target_dir.exists():
                      shutil.rmtree(target_dir)

                  try:
                      subprocess.run(
                          [
                              "gh",
                              "run",
                              "download",
                              str(run_id),
                              "--repo",
                              repo,
                              "--name",
                              artifact_name,
                              "--dir",
                              str(target_dir),
                          ],
                          check=True,
                          capture_output=True,
                          text=True,
                      )
                  except subprocess.CalledProcessError as exc:
                      warn(
                          f"{artifact_name} from run {run_id} failed to download "
                          f"with exit {exc.returncode}.{command_error_detail(exc)}"
                      )
                      continue

                  fallback_markets.add(market)
                  print(
                      f"Using fallback artifact {artifact_name} from Static Site run {run_id} on {branch_name}.",
                      flush=True,
                  )

          if fallback_markets:
              print(
                  f"Downloaded fallback market artifacts: {', '.join(sorted(fallback_markets))}.",
                  flush=True,
              )
          else:
              print(f"No fallback market artifacts found on {branch_name}.")
          PY

      - name: Validate market artifacts
        if: needs.select-markets.outputs.repair != 'true'
        run: |
          mkdir -p /tmp/static-market-artifacts-current /tmp/static-market-artifacts-fallback
          cd backend
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          # This deployment publishes a US-only static site. STATIC_SITE_MARKETS
          # (comma-separated, default "US") lists the markets that must be
          # present across current + fallback artifacts before publishing, so a
          # failed build can never ship an incomplete site for the markets we
          # actually serve.
          expected = {
              m.strip().upper()
              for m in os.environ.get("STATIC_SITE_MARKETS", "US").split(",")
              if m.strip()
          }
          present = set()
          for base in (
              "/tmp/static-market-artifacts-current",
              "/tmp/static-market-artifacts-fallback",
          ):
              for manifest in Path(base).rglob("manifest.market.json"):
                  try:
                      market = str(
                          json.loads(manifest.read_text(encoding="utf-8")).get("market", "")
                      ).upper()
                  except (OSError, json.JSONDecodeError, TypeError) as exc:
                      print(f"::warning::Could not read {manifest}: {exc}", flush=True)
                      continue
                  if market:
                      present.add(market)

          print(f"Expected markets: {', '.join(sorted(expected))}")
          print(f"Present markets:  {', '.join(sorted(present)) or '(none)'}")

          missing = sorted(expected - present)
          if missing:
              print(
                  "::error::Refusing to publish an incomplete static site. No current "
                  f"build and no fallback artifact for: {', '.join(missing)}.",
                  flush=True,
              )
              sys.exit(1)
          print("All supported markets present; static site is complete.")
          PY

      - name: Combine static data bundle
        if: needs.select-markets.outputs.repair != 'true'
        run: |
          cd backend
          python -m app.scripts.export_static_site \
            --output-dir ../frontend/public/static-data \
            --combine-artifacts-dir /tmp/static-market-artifacts-current \
            --fallback-artifacts-dir /tmp/static-market-artifacts-fallback

      - name: Cache public SEC archives and security mappings
        if: needs.select-markets.outputs.repair != 'true'
        uses: actions/cache@v4
        with:
          path: .cache/sec13f
          key: sec13f-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec13f-v2-
      - name: Select exact long-history retry cache date
        id: history-target
        if: needs.select-markets.outputs.mode == 'full'
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          manifest=json.load(open('frontend/public/static-data/manifest.json'))
          target=manifest.get('markets',{}).get('US',manifest)['as_of_date']
          assert date.fromisoformat(target).isoformat()==target
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write(f'date={target}\n')
          PY
      - name: Restore same-session long-history responses for bounded retries
        id: history-cache
        if: needs.select-markets.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: frontend/.cache/market-history
          # One bounded raw-response cache per target/compiler, not per retry.
          # Different dates never accumulate in the same restored directory.
          key: market-long-history-v1-${{ steps.history-target.outputs.date }}-${{ hashFiles('frontend/tools/collect-market-history.py') }}
      - name: Build static frontend
        id: build-frontend
        env:
          GH_TOKEN: ${{ github.token }}
          PRICE_REPAIR: ${{ needs.select-markets.outputs.repair }}
          MARKET_BUILD_MODE: ${{ needs.select-markets.outputs.mode }}
          SEC_USER_AGENT: ${{ needs.select-markets.outputs.repair != 'true' && secrets.SEC_USER_AGENT || '' }}
          VITE_STATIC_SITE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        run: |
          if [ "$PRICE_REPAIR" = "true" ]; then
            node .github/scripts/retained-price-source-admission.mjs produce --output "$RUNNER_TEMP/retained-price-source" --job-start "$RUNNER_TEMP/retained-price-source-job-start"
          else
            cd frontend
            npm run test:run -- src/static/qualificationAudit.test.js src/static/bookProfiles.test.js src/static/bookTechnicalEvidence.test.js src/static/bookFinancialEvidence.test.js src/static/bookPatternReview.test.js src/static/components/BookPatternReview.test.jsx src/static/partialSalePlan.test.js src/static/components/PartialSalePlan.test.jsx src/static/bookExitEvidence.test.js src/static/bookBreakoutJournal.test.js src/static/components/BookExitEvidence.test.jsx src/static/bookMarketEvidence.test.js src/static/localTradeJournal.test.js src/static/components/LocalTradeJournal.test.jsx src/static/marketLeadership.test.js src/static/bookChartDiagnostics.test.js src/static/bookRiskPolicy.test.js src/static/components/BookRiskWorkbench.test.jsx src/static/researchEngine.test.js src/static/portfolioPlan.test.js src/static/breadthSummary.test.js --maxWorkers=2
            python tools/test_sec_financials.py
            python tools/export-book-benchmark.py --allow-unavailable
            node tools/restore-market-trend-source.mjs
            node tools/restore-market-history-source.mjs
            python tools/collect-market-trends.py --allow-unavailable
            python tools/restore-candidate-history.py
            python tools/export-sector-prices.py
            node tools/repair-price-history.mjs
            node tools/producer-price-history.mjs
            python tools/test_institutional_holdings.py
            python tools/test_recalculate_setups.py
            python tools/export-institutional.py --refresh --mapping-limit 200
            python tools/recalculate-setups.py
            node tools/export-research.mjs
            if [ "$MARKET_BUILD_MODE" = "full" ]; then
              python tools/collect-market-history.py --root public/static-data --cache .cache/market-history --output public/static-data/market-history-source.json --allow-unavailable --report "$RUNNER_TEMP/market-history-update.json"
              if python -c 'import json,os,sys; sys.exit(0 if json.load(open(os.environ["RUNNER_TEMP"]+"/market-history-update.json"))["updated"] else 1)'; then
                python tools/audit-market-history.py --source public/static-data/market-history-source.json --cache .cache/market-history --output public/static-data/market-history-replay.json
              else
                echo '::warning::Long market history remains at its actual prior observation date. The post-close watchdog will retry the missing completed session.'
              fi
            fi
            python tools/sec-financials.py --limit 60
            npm run build
            node tools/check-data-quality.mjs
          fi

      - name: Preserve verified raw responses for a failed or delayed-provider retry
        if: ${{ always() && needs.select-markets.outputs.mode == 'full' && steps.history-cache.outputs.cache-hit != 'true' && steps.history-target.outputs.date != '' && hashFiles('frontend/.cache/market-history/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: frontend/.cache/market-history
          key: ${{ steps.history-cache.outputs.cache-primary-key }}

      - name: Retain actual long-history freshness and independent replay result
        if: ${{ always() && needs.select-markets.outputs.mode == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: market-history-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/market-history-update.json
            frontend/public/static-data/market-history-replay.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify finite retained-price repair
        if: needs.select-markets.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retained-price-source-admission.mjs verify-produced --output "$RUNNER_TEMP/retained-price-source"

      - name: Bind downstream close observations after both quality gates
        if: needs.select-markets.outputs.repair != 'true'
        run: node .github/scripts/export-source-promotion-inputs.mjs frontend/dist/static-data /tmp/daily-source-downstream.json

      - name: Record the actual downstream producer attempt
        if: needs.select-markets.outputs.repair != 'true'
        id: source-downstream-record
        run: |
          cd backend
          python -m app.scripts.daily_price_artifact_provenance record --role downstream \
            --root /tmp --paths daily-source-downstream.json --record /tmp/daily-source-downstream-producer.json

      - name: Retain downstream source-promotion inputs
        if: needs.select-markets.outputs.repair != 'true'
        id: source-downstream
        uses: actions/upload-artifact@v4
        with:
          name: daily-source-downstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/daily-source-downstream.json
            /tmp/daily-source-downstream-producer.json
          if-no-files-found: error
          retention-days: 7

      # Preserve fresh exports while the UI release gates are pending or failing.
      # Research UI Release rebuilds this data using the exact verified main SHA.
      - name: Upload verified data export
        id: upload-data-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: static-site-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build-frontend.outputs.site_dir || 'frontend/dist' }}
          retention-days: 7

      - name: Record exact export attempt and dated evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PRICE_REPAIR: ${{ needs.select-markets.outputs.repair }}
          PRICE_ARTIFACT_ID: ${{ steps.upload-data-artifact.outputs.artifact_id }}
        run: |
          if [ "$PRICE_REPAIR" = "true" ]; then
            [[ "$PRICE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            artifact_digest=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PRICE_ARTIFACT_ID" --jq .digest)
            [[ "$artifact_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            node .github/scripts/retained-price-source-admission.mjs companion --output "$RUNNER_TEMP/retained-price-source" --artifact-id "$PRICE_ARTIFACT_ID" --artifact-digest "$artifact_digest"
          else
            node .github/scripts/select-release-source.mjs export-metadata
          fi
      - name: Preserve dated export provenance for release selection
        uses: actions/upload-artifact@v4
        with:
          name: static-site-data-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/export-provenance/source.json
          retention-days: 7
          if-no-files-found: error

      - name: Preserve finite price producer diagnostic reports
        if: always() && needs.select-markets.outputs.repair == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: retained-price-source-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-price-source/report.json
            ${{ runner.temp }}/retained-price-source-supervisor/supervisor.json
            ${{ runner.temp }}/retained-price-source-supervisor/heartbeat.jsonl
            ${{ runner.temp }}/retained-price-source/storage-preflight.json
            ${{ runner.temp }}/retained-price-source/compiler-evaluation.json
            ${{ runner.temp }}/retained-price-source-driver-plan.json
            ${{ runner.temp }}/retained-price-source-inputs/original-api-evidence.json
          if-no-files-found: ignore
          retention-days: 7

  wake-postclose-watchdog:
    # Dispatch while this last job finishes; the receiver waits for this exact
    # run/attempt to become terminal before invoking the unchanged watchdog.
    # Do not rely only on delivery of a workflow_run completion event.
    # A failed auxiliary wakeup must not invalidate already verified exports;
    # workflow_run delivery and scheduled recovery remain available.
    continue-on-error: true
    needs: [select-markets, build-market, combine-and-build, promote-daily-source]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.select-markets.result == 'success' && needs.select-markets.outputs.repair != 'true' && needs.select-markets.outputs.mode == 'full' && contains(fromJSON(needs.select-markets.outputs.markets || '[]'), 'US') && needs.build-market.result == 'success' && needs.combine-and-build.result == 'success' && (needs.promote-daily-source.result == 'success' || needs.promote-daily-source.result == 'skipped') }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request exact-source completion check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A lost dispatch response may queue more than one watchdog. Its
          # existing serialized planner prevents duplicate recovery work.
          for relay_try in 1 2 3; do
            if gh workflow run postclose-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f producer_run_id="$GITHUB_RUN_ID" -f producer_run_attempt="$GITHUB_RUN_ATTEMPT"; then
              exit 0
            fi
            echo "::warning::Completion wakeup attempt $relay_try failed; scheduled recovery remains active."
            if [ "$relay_try" -lt 3 ]; then sleep 5; fi
          done
          exit 1

  promote-daily-source:
    needs: [select-markets, build-market, combine-and-build]
    if: ${{ needs.select-markets.outputs.source_promotion == 'true' && contains(fromJSON(needs.select-markets.outputs.markets), 'US') && needs.select-markets.outputs.mode == 'full' && needs.build-market.result == 'success' && needs.build-market.outputs.produced_candidate == 'true' && needs.build-market.outputs.source_candidate_id != '' && needs.combine-and-build.result == 'success' && needs.combine-and-build.outputs.downstream_artifact_id != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: daily-price-source-promotion-us
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r .github/scripts/daily-price-promotion-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-market.outputs.source_candidate_id }}
          path: /tmp/source-candidate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.combine-and-build.outputs.downstream_artifact_id }}
          path: /tmp/source-downstream
          merge-multiple: true
      - name: Verify immutable IDs and the original producer attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.daily_price_artifact_provenance verify --role candidate \
            --root /tmp/source-candidate --record /tmp/source-candidate/daily-price-promotion/producer.json \
            --artifact-id '${{ needs.build-market.outputs.source_candidate_id }}' \
            --artifact-digest '${{ needs.build-market.outputs.source_candidate_digest }}' \
            --producer-attempt '${{ needs.build-market.outputs.source_producer_attempt }}'
          python -m app.scripts.daily_price_artifact_provenance verify --role downstream \
            --root /tmp/source-downstream --record /tmp/source-downstream/daily-source-downstream-producer.json \
            --artifact-id '${{ needs.combine-and-build.outputs.downstream_artifact_id }}' \
            --artifact-digest '${{ needs.combine-and-build.outputs.downstream_artifact_digest }}' \
            --producer-attempt '${{ needs.combine-and-build.outputs.downstream_producer_attempt }}'
      - name: Promote immutable source with conditional predecessor update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.stage_daily_price_source publish \
            --repository "${{ github.repository }}" \
            --controller-sha "$GITHUB_SHA" --controller-ref "$GITHUB_REF" \
            --capture /tmp/source-candidate/daily-price-promotion/previous.json \
            --bundle "$(find /tmp/source-candidate/daily-price -maxdepth 1 -name 'daily-price-us-*.json.gz' -print -quit)" \
            --manifest /tmp/source-candidate/daily-price/daily-price-latest-us.json \
            --downstream /tmp/source-downstream/daily-source-downstream.json \
            --completion-receipt /tmp/source-promotion-completion.json
      - name: Preserve actual verified source completion time
        uses: actions/upload-artifact@v4
        with:
          name: daily-source-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/source-promotion-completion.json
