name: Oct6 Numeric Inventory Probe

on:
  push:
    branches: [preview/oct6-numeric-inventory-probe-20261007]

permissions:
  contents: read
  actions: read

concurrency:
  group: oct6-numeric-inventory-probe-20261007
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'kusennjp1-ai/screener' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify strict inventory tests
        run: node --test .github/scripts/retained-price-live-inventory.test.mjs
      - name: Compare bounded official API endpoint views
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/probe-oct6-numeric-inventory.mjs
      - name: Retain public response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oct6-numeric-inventory-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oct6-numeric-inventory-probe/
          if-no-files-found: error
          retention-days: 7
