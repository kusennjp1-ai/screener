name: Research UI Release
on:
  workflow_dispatch:
    inputs:
      ui_only:
        description: 'Reuse verified evidence; ordinary new UI requires both quality gates'
        type: boolean
        default: false
      limited_research_preview:
        description: 'Explicit limited preview: committed exact approval intent path; frozen captured UI/data only'
        type: string
        default: ''
      financial_source_renewal:
        description: 'Disabled until exact review: committed same-UI same-price renewal intent JSON'
        type: string
        default: ''
      financial_correction:
        description: 'Prepare only: financial-correction-v1 intent bound to exact predecessor/source; never deploys'
        type: string
        default: ''
      allow_sec_coverage_drop:
        description: 'Owner approval only, and only when the repository variable SEC_CARRY_FORWARD_REQUIRED is true: let a UI-only republish publish fewer or changed same-day SEC records than the live publication'
        type: boolean
        default: false
  workflow_run:
    workflows: [CI, Design Acceptance, Static Site]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: research-ui-release
  cancel-in-progress: false
jobs:
  renewal_route:
    name: Route exact renewal CI admission
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      renewal: ${{ steps.route.outputs.renewal }}
      ordinary_hold: ${{ steps.ordinary-route.outputs.ordinary_hold }}
      ordinary_ci: ${{ steps.ordinary-route.outputs.ordinary_ci }}
      price_wait: ${{ steps.price-route.outputs.price_wait }}
      price_source: ${{ steps.price-route.outputs.price_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reserve the exact ordinary carry request before other routes
        id: ordinary-route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ordinary-carry-tooling.mjs ci-route
      - name: '${{ steps.ordinary-route.outputs.ordinary_hold_marker }}'
        if: steps.ordinary-route.outputs.ordinary_hold == 'true'
        run: ':'
      - name: Route the finite price activation before any publication
        if: steps.ordinary-route.outputs.ordinary_hold != 'true' && steps.ordinary-route.outputs.ordinary_ci != 'true'
        id: price-route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retained-price-ci-admission.mjs publication-route
      - name: Hold finite retained-price activation
        if: steps.price-route.outputs.price_wait == 'true'
        run: ':'
      - name: Resolve only the exact admitted renewal route
        if: steps.ordinary-route.outputs.ordinary_hold != 'true' && steps.ordinary-route.outputs.ordinary_ci != 'true' && steps.price-route.outputs.price_wait != 'true' && steps.price-route.outputs.price_source != 'true'
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/financial-renewal-ci-routing.mjs route
      - name: 'Ordinary non-CI publication: ${{ steps.route.outputs.source_run_id }}/${{ steps.route.outputs.source_run_attempt }}'
        if: steps.route.outputs.ordinary_non_ci == 'true'
        run: ':'
  publish:
    needs: renewal_route
    if: needs.renewal_route.result == 'success' && needs.renewal_route.outputs.ordinary_hold != 'true' && needs.renewal_route.outputs.price_wait != 'true' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.renewal_route.outputs.price_source == 'true' && 110 || 360 }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Record first finite publisher step clock
        if: needs.renewal_route.outputs.price_source == 'true'
        run: date +%s > "$RUNNER_TEMP/retained-price-publisher-job-start"
      # Reconcile main after taking the serial lock. A stale completion event may
      # replace a newer pending event, but can never choose an unverified UI SHA.
      - name: Resolve current main under the publication lock
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.main.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the clean ordinary CI controller worktree
        if: needs.renewal_route.outputs.ordinary_ci == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ordinary-carry-tooling.mjs ci-prepare-controller
      - name: Verify exact ordinary carry CI admission
        id: ordinary-admission
        if: needs.renewal_route.outputs.ordinary_ci == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ordinary-carry-tooling.mjs ci-admit
      - name: Admit exact successful main CI renewal
        timeout-minutes: 5
        if: needs.renewal_route.outputs.renewal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/financial-renewal-ci-routing.mjs admit
      - name: Resolve the exact versioned exception controls
        if: (github.event_name != 'workflow_dispatch' || inputs.limited_research_preview == '')
        id: exception_controls
        run: node .github/scripts/financial-performance-exception.mjs controls
      - name: Restore the exact exception capture Git objects
        if: steps.exception_controls.outputs.pinned_capture_shas != ''
        env:
          CAPTURE_SHAS: ${{ steps.exception_controls.outputs.pinned_capture_shas }}
        run: for capture_sha in $CAPTURE_SHAS; do git fetch --no-tags origin "$capture_sha"; done
      - uses: actions/setup-python@v5
        if: (github.event_name != 'workflow_dispatch' || inputs.limited_research_preview == '') && (needs.renewal_route.outputs.price_source == 'true' || hashFiles('.github/financial-release-request.json') != '' || hashFiles('.github/financial-source-renewal-request.json') != '' || (github.event_name == 'workflow_dispatch' && inputs.financial_correction != ''))
        with:
          python-version: '3.11'
      - name: Install offline statement projection dependencies
        if: (github.event_name != 'workflow_dispatch' || inputs.limited_research_preview == '') && (needs.renewal_route.outputs.price_source == 'true' || hashFiles('.github/financial-release-request.json') != '' || hashFiles('.github/financial-source-renewal-request.json') != '' || (github.event_name == 'workflow_dispatch' && inputs.financial_correction != ''))
        run: |
          python -m venv "$RUNNER_TEMP/financial-replay-runtime"
          "$RUNNER_TEMP/financial-replay-runtime/bin/python" -m pip install -r .github/scripts/financial-release-projection-requirements.txt
          echo "$RUNNER_TEMP/financial-replay-runtime/bin" >> "$GITHUB_PATH"
          echo "FINANCIAL_REPLAY_PYTHON=$RUNNER_TEMP/financial-replay-runtime/bin/python" >> "$GITHUB_ENV"
      - name: Bind existing pinned arithmetic runtime for finite replay
        if: needs.renewal_route.outputs.price_source == 'true'
        run: |
          test -x "$RUNNER_TEMP/financial-replay-runtime/bin/python3.11"
          echo "RETAINED_PRICE_PYTHON=$RUNNER_TEMP/financial-replay-runtime/bin/python3.11" >> "$GITHUB_ENV"
      - name: Verify isolated offline native projection runtime
        if: (github.event_name != 'workflow_dispatch' || inputs.limited_research_preview == '') && (hashFiles('.github/financial-release-request.json') != '' || hashFiles('.github/financial-source-renewal-request.json') != '' || (github.event_name == 'workflow_dispatch' && inputs.financial_correction != ''))
        env:
          PYTHONPATH: backend
          LITELLM_LOCAL_MODEL_COST_MAP: 'true'
        run: python -m unittest tests.unit.test_native_annual_projection.TestNativeAnnualProjection.test_new_policy_binds_source_without_changing_originals_or_quarterly_scalars
      - name: Verify live provenance, UI gates and non-regressing data
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs plan
      - name: Prepare immutable controller for finite price publication
        if: steps.plan.outputs.publish == 'true' && needs.renewal_route.outputs.price_source == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retained-price-source-admission.mjs prepare-controller --output "$RUNNER_TEMP/retained-price-controller"
      # Controller tooling only: the approved UI tree is not checked out yet. The
      # existing job token (contents: read, actions: read, pages: write,
      # id-token: write) is used only for read-only releases listing; every
      # archive download is anonymous.
      # Unverified carries simply stay hosted; an indexed copy that is no longer
      # verifiably public fails the run before anything is built or deployed.
      - name: Verify the public audit archive before omitting older carries
        id: audit-archive
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.carry == 'true' && steps.plan.outputs.limited_research_preview != 'true' && needs.renewal_route.outputs.price_source != 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs audit-archive
      - name: Checkout the exact verified UI source
        if: steps.plan.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.sha }}
          path: release
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: release/frontend/package-lock.json
      # Controller restores authenticated history before enrichment; do not run
      # the separately approved UI revision's older network history helper.
      - name: Restore the exact selected data artifact
        id: restore
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RETAINED_PRICE_PUBLISHER_JOB_START: ${{ runner.temp }}/retained-price-publisher-job-start
        run: node .github/scripts/select-release-source.mjs restore
      # A UI-only republish (verified live input, no SEC fetch) restores the live logical tree here, before
      # any export: record which same-day SEC records it publishes. The reviewed controller's own tool
      # reads it (node built-ins and src/static only) and writes outside the restored data root. It never
      # fails on the data (an unreadable tree is written down as unavailable); the file check catches a
      # tool that did not run at all.
      - name: Record the live publication's SEC records before a UI-only republish
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.published_input == 'true' && steps.plan.outputs.mode == 'ui' && steps.plan.outputs.limited_research_preview != 'true' && steps.restore.outputs.offline_recovery_verified != 'true'
        run: |
          node frontend/tools/report-data-coverage.mjs --published --root release/frontend/public --label 'live, before republish' --json "$RUNNER_TEMP/live-fundamentals-coverage.json"
          test -s "$RUNNER_TEMP/live-fundamentals-coverage.json"
      - uses: actions/setup-python@v5
        if: steps.restore.outputs.offline_session_calendar == 'true'
        with:
          python-version: '3.11'
      - name: Install isolated offline session calendar runtime
        if: steps.restore.outputs.offline_session_calendar == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/session-calendar-runtime"
          "$RUNNER_TEMP/session-calendar-runtime/bin/python" -m pip install -r .github/scripts/session-calendar-requirements.txt
          echo "SESSION_CALENDAR_PYTHON=$RUNNER_TEMP/session-calendar-runtime/bin/python" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
        if: steps.plan.outputs.publish == 'true'
        working-directory: release/frontend
      - name: Install locked Chromium for finite price verification
        if: steps.restore.outputs.offline_recovery_verified == 'true'
        timeout-minutes: 10
        working-directory: release/frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify research rules and 100 synthetic task profiles
        if: steps.plan.outputs.publish == 'true'
        # The approved UI may be the previous research workspace (data-only releases) or
        # the brief: vitest silently skips a filter that matches no file whenever another
        # filter matches, so a file that exists in only one approved tree is named only beside
        # its counterpart in the other. The brief's view-model and stock-view tests name both
        # layouts until every approved tree is past the round-1 split: briefModel.test.js
        # (before the split) beside briefModelShared, briefCandidate, positionSizing, briefSell,
        # briefChartModel, briefEnvironment and the Stock*Card / StockVerdict tests (after it);
        # briefModel.test.js is removed from this list then. The SEC admission test
        # (bookFinancialAdmission.test.js) joins once every approved tree has it; until then
        # the daily Static Site build runs it before its export.
        run: npm run test:run -- src/static/researchPresentation.test.js src/static/financialHistory.test.js src/static/entryReadiness.test.js src/components/Charts/bookAnnotations.test.js src/components/Charts/vcpBoxPrimitive.test.js src/static/qualificationAudit.test.js src/static/bookProfiles.test.js src/static/bookTechnicalEvidence.test.js src/static/bookFinancialEvidence.test.js src/static/bookMarketEvidence.test.js src/static/marketLeadership.test.js src/static/bookChartDiagnostics.test.js src/static/researchEngine.test.js src/static/portfolioPlan.test.js src/App.static.test.jsx src/static/candidateHistory.test.js src/static/sectorStrength.test.js src/static/marketLongHistory.test.js src/static/chartPayloadIdentity.test.js src/static/brief/briefModel.test.js src/static/brief/briefModelShared.test.js src/static/brief/briefCandidate.test.js src/static/brief/positionSizing.test.js src/static/brief/briefSell.test.js src/static/brief/briefChartModel.test.js src/static/brief/briefEnvironment.test.js src/static/brief/priceChart.test.js src/static/brief/MarketCard.test.jsx src/static/brief/StockView.test.jsx src/static/brief/StockVerdict.test.jsx src/static/brief/StockChartCard.test.jsx src/static/brief/StockFundamentalsCard.test.jsx src/static/brief/StockSellCard.test.jsx src/static/brief/StockPlanCard.test.jsx src/static/brief/useWatchSellChecks.test.jsx --maxWorkers=2
        working-directory: release/frontend
      - name: Cache public SEC archives and security mappings
        if: steps.plan.outputs.limited_research_preview != 'true' && steps.restore.outputs.offline_recovery_verified != 'true' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.correction != 'true' && steps.plan.outputs.activation != 'true' && steps.plan.outputs.renewal != 'true'
        uses: actions/cache@v4
        with:
          path: release/.cache/sec13f
          key: sec13f-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec13f-v2-
      - name: Prepare independently verifiable book evidence
        if: ${{ steps.plan.outputs.ordinary_ci != 'true' && steps.plan.outputs.limited_research_preview != 'true' && steps.restore.outputs.offline_recovery_verified != 'true' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.migration != 'true' && steps.plan.outputs.correction != 'true' && steps.plan.outputs.activation != 'true' && steps.plan.outputs.renewal != 'true' && steps.plan.outputs.published_input != 'true' && !inputs.ui_only }}
        working-directory: release/frontend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RELEASE_CARRIES_FINANCIALS: ${{ steps.plan.outputs.carry }}
        run: |
          python -m pip install 'yfinance==1.2.1' 'pandas_market_calendars==5.4.0'
          python tools/test_sec_financials.py
          python tools/test_export_book_benchmark.py
          python tools/export-book-benchmark.py --allow-unavailable
          python tools/export-sector-prices.py
          node tools/repair-price-history.mjs
          python tools/test_institutional_holdings.py
          python tools/test_recalculate_setups.py
          python tools/export-institutional.py --refresh --mapping-limit 200
          python tools/recalculate-setups.py
          node tools/export-research.mjs
          python tools/test_export_entry_context.py
          # The tool's own default budget: every brief-listable row first, at most
          # 1500 symbols at <=5 req/s. An older approved UI tree keeps its smaller default.
          python tools/sec-financials.py
          python tools/test_export_financial_history.py
          # Under the financial carry every row's history is replaced by the carried
          # one, so no Yahoo request is made (the same empty file prepare-carry writes).
          if [ "$RELEASE_CARRIES_FINANCIALS" = true ]; then python tools/export-financial-history.py --limit 0; else python tools/export-financial-history.py --limit 300; fi
          # Earnings dates must exist before the final export, or the rows never carry them.
          python tools/export-entry-context.py
          node tools/export-research.mjs
      - name: Prepare workbench using verified published evidence
        if: ${{ steps.plan.outputs.ordinary_ci != 'true' && steps.plan.outputs.limited_research_preview != 'true' && steps.restore.outputs.offline_recovery_verified != 'true' && steps.plan.outputs.publish == 'true' && steps.plan.outputs.migration != 'true' && steps.plan.outputs.correction != 'true' && steps.plan.outputs.activation != 'true' && steps.plan.outputs.renewal != 'true' && steps.plan.outputs.published_input != 'true' && inputs.ui_only && steps.restore.outputs.offline_session_calendar != 'true' }}
        working-directory: release/frontend
        run: |
          python -m pip install 'yfinance==1.2.1' 'pandas_market_calendars==5.4.0'
          python tools/export-book-benchmark.py --allow-unavailable
          python tools/export-sector-prices.py
      - name: Carry the active financial source onto the new price target
        if: steps.plan.outputs.limited_research_preview != 'true' && steps.plan.outputs.carry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs prepare-carry
      # Correction mode runs only the pinned archive projector and approved
      # exporter. It deliberately skips every provider/enrichment/repair step.
      - name: Verify publisher tooling before finite build
        if: steps.restore.outputs.offline_recovery_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs publisher-build-before
      - name: Build the exact ordinary carry with reviewed controller tooling
        if: steps.plan.outputs.limited_research_preview != 'true' && steps.plan.outputs.publish == 'true' && env.ORDINARY_CARRY_TOOLING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        run: node .github/scripts/select-release-source.mjs ordinary-carry-build
      - name: Build with daily selection export
        if: steps.plan.outputs.limited_research_preview != 'true' && steps.plan.outputs.publish == 'true' && env.ORDINARY_CARRY_TOOLING != 'true'
        working-directory: release/frontend
        env:
          METADATA_MIGRATION: ${{ steps.plan.outputs.migration }}
          FINANCIAL_ACTIVATION: ${{ steps.plan.outputs.activation }}
          FINANCIAL_SOURCE_RENEWAL: ${{ steps.plan.outputs.renewal }}
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        run: |
          if [ "$METADATA_MIGRATION" != true ] && [ "$FINANCIAL_ACTIVATION" != true ] && [ "$FINANCIAL_SOURCE_RENEWAL" != true ]; then npm run build; fi
          node tools/check-data-quality.mjs
      - name: Verify publisher tooling after finite build
        if: steps.restore.outputs.offline_recovery_verified == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs publisher-build-after
      - name: Verify frozen captured data quality
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.limited_research_preview == 'true'
        working-directory: release/frontend
        run: node tools/check-data-quality.mjs
      - name: Report published fundamentals coverage and compare a UI-only republish's SEC records
        # Read-only, on the logical files before packing, with the reviewed controller's tool (release/ may
        # hold an older approved UI): per brief-listable row the SEC record, tiles, Code 33 state and why it
        # stays unknown, the publication's SEC admission, and a job-summary table. Its findings are warnings.
        # A UI-only republish is compared with the live publication's same-day SEC records: a dropped or
        # changed record, or a comparison that cannot be made (未計測), is a warning (the round-1 default,
        # plan §9.1). Failing the release on it is the owner's decision: it applies only once the repository
        # variable SEC_CARRY_FORWARD_REQUIRED is 'true', and allow_sec_coverage_drop (a manual dispatch) then
        # lets one approved drop through.
        if: steps.plan.outputs.publish == 'true' && steps.restore.outputs.offline_recovery_verified != 'true'
        env:
          UI_ONLY_REPUBLISH: ${{ steps.plan.outputs.published_input == 'true' && steps.plan.outputs.mode == 'ui' && steps.plan.outputs.limited_research_preview != 'true' }}
          SEC_CARRY_FORWARD_REQUIRED: ${{ vars.SEC_CARRY_FORWARD_REQUIRED == 'true' }}
          ALLOW_SEC_COVERAGE_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_sec_coverage_drop == true }}
        run: |
          args=(--published --root release/frontend/public --json "$RUNNER_TEMP/published-fundamentals-coverage.json")
          if [ "$UI_ONLY_REPUBLISH" = true ]; then
            args+=(--previous "$RUNNER_TEMP/live-fundamentals-coverage.json" --ui-only-republish)
            if [ "$SEC_CARRY_FORWARD_REQUIRED" = true ]; then args+=(--require-sec-carry-forward); fi
          fi
          if [ "$ALLOW_SEC_COVERAGE_DROP" = true ]; then args+=(--allow-sec-coverage-drop); fi
          node frontend/tools/report-data-coverage.mjs "${args[@]}"
          test -s "$RUNNER_TEMP/published-fundamentals-coverage.json"
      - name: Preserve approved UI bytes or record verified new UI
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs compose
      - name: Verify composed finite price browser and CSV surfaces
        if: steps.restore.outputs.offline_recovery_verified == 'true'
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/retained-price-source-browser.mjs
      - name: Preserve correction source and predecessor audit material
        if: steps.plan.outputs.correction == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: financial-correction-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified-publication/correction-source
            ${{ runner.temp }}/verified-publication/correction-predecessor
            ${{ runner.temp }}/verified-publication/correction-predecessor-artifact
            ${{ runner.temp }}/verified-publication/correction-projection
            ${{ runner.temp }}/verified-publication/state.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve retained-universe verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-publication/retained-universe-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Recheck live identity, main and final data before uploading
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs recheck
      - name: Retain reviewed financial correction candidate
        if: steps.plan.outputs.correction == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: financial-correction-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/frontend/dist
          retention-days: 90
          if-no-files-found: error
      # Diagnostic only: exact bytes per logical family of the final tree, read
      # through both transport layers. It runs from this controller checkout
      # (release/ may hold an older approved UI), never writes to the dist, and
      # also reports a run whose compose payload check already failed.
      - name: Report final Pages bytes per logical family (diagnostic only)
        if: ${{ !cancelled() && steps.plan.outputs.publish == 'true' && steps.plan.outputs.correction != 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: node frontend/tools/site-size-breakdown.mjs release/frontend/dist 60 || echo '::warning::Final Pages size breakdown unavailable'
      - name: Enforce final GitHub Pages payload and TAR limits
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.correction != 'true'
        run: python3 .github/scripts/check-pages-payload.py release/frontend/dist
      - uses: actions/upload-pages-artifact@v4
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.correction != 'true'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/frontend/dist
          retention-days: 7
      - name: Reject a superseded release immediately before deployment
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-release-source.mjs recheck
      # The performance exception additionally needs its separate hash-bound
      # release-intent record. A certificate or pin alone never enables it.
      # Correction activation needs a separately reviewed, hash-bound promotion
      # request after durable operator backup. No boolean can bypass that step.
      - name: Deploy to GitHub Pages
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.correction != 'true'
        uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve finite price publication diagnostic reports
        if: always() && needs.renewal_route.outputs.price_source == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: retained-price-publication-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/verified-publication/finite-source-replay/report.json
            ${{ runner.temp }}/verified-publication/finite-source-replay-supervisor/supervisor.json
            ${{ runner.temp }}/verified-publication/finite-source-replay-supervisor/heartbeat.jsonl
            ${{ runner.temp }}/verified-publication/finite-source-replay/storage-preflight.json
            ${{ runner.temp }}/verified-publication/finite-source-replay/compiler-evaluation.json
            ${{ runner.temp }}/verified-publication/finite-source-replay-driver-plan.json
            ${{ runner.temp }}/verified-publication/finite-source-replay-inputs/original-api-evidence.json
            ${{ runner.temp }}/verified-publication/finite-source-replay/replay-verification.json
            ${{ runner.temp }}/verified-publication/finite-source-browser/report.json
            ${{ runner.temp }}/verified-publication/finite-source-browser/NVDA.png
            ${{ runner.temp }}/verified-publication/finite-source-browser/FUTU.png
            ${{ runner.temp }}/verified-publication/finite-source-browser/ALH.png
            ${{ runner.temp }}/verified-publication/finite-source-browser/LPSN.png
            ${{ runner.temp }}/verified-publication/finite-source-browser/AIHS.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain automatic quota observations independently of publication
        if: always() && needs.renewal_route.outputs.renewal == 'true'
        # A post-deploy audit-storage outage must not turn the successfully
        # published caller into failed historical publication authority.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: financial-renewal-quota-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/financial-renewal-quota
          retention-days: 14
          if-no-files-found: ignore
