name: Research UI Release
on:
  workflow_dispatch:
    inputs:
      ui_only:
        description: 'Reuse verified published fundamentals and setups for display-only changes'
        type: boolean
        default: false
  # Either quality gate can finish last; exports may finish before or after them.
  # This is the only workflow that deploys Pages.
  workflow_run:
    workflows: [CI, Design Acceptance, Static Site]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: research-ui-release
  cancel-in-progress: false
env:
  # workflow_run's default checkout is the latest default branch, not its tested head.
  RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name != 'Static Site' && github.event.workflow_run.head_sha || github.sha }}
jobs:
  eligibility:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.repository.full_name == github.repository &&
        (github.event.workflow_run.name == 'Static Site' || github.event.workflow_run.event == 'push')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact current main revision and both automatic release gates
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publication-gate.mjs

  publish:
    needs: eligibility
    if: needs.eligibility.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.eligibility.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Verify research rules and 100 synthetic task profiles
        run: npm run test:run -- src/static/researchPresentation.test.js src/static/financialHistory.test.js src/static/personalQuote.test.js src/static/usePersonalQuote.test.jsx src/static/components/QuoteConnection.test.jsx src/static/entryReadiness.test.js src/static/swipeNavigation.test.js src/components/Charts/bookAnnotations.test.js src/components/Charts/vcpBoxPrimitive.test.js src/static/StaticChartViewerModal.test.jsx src/static/qualificationAudit.test.js src/static/bookProfiles.test.js src/static/bookTechnicalEvidence.test.js src/static/bookFinancialEvidence.test.js src/static/bookPatternReview.test.js src/static/components/BookPatternReview.test.jsx src/static/partialSalePlan.test.js src/static/components/PartialSalePlan.test.jsx src/static/bookExitEvidence.test.js src/static/bookBreakoutJournal.test.js src/static/components/BookExitEvidence.test.jsx src/static/bookMarketEvidence.test.js src/static/localTradeJournal.test.js src/static/components/LocalTradeJournal.test.jsx src/static/marketLeadership.test.js src/static/bookChartDiagnostics.test.js src/static/bookRiskPolicy.test.js src/static/components/BookRiskWorkbench.test.jsx src/static/breadthSummary.test.js src/static/pages/StaticBreadthPage.test.jsx src/static/researchEngine.test.js src/static/portfolioPlan.test.js src/static/components/QualificationVerification.test.jsx src/static/components/PortfolioDecision.test.jsx src/static/pages/ResearchPage.test.jsx src/static/components/ResearchChart.test.jsx src/App.static.test.jsx src/static/candidateHistory.test.js src/static/sectorStrength.test.js src/static/components/DailyChanges.test.jsx src/static/components/CandidateCharts.test.jsx --maxWorkers=2
        working-directory: frontend
      - name: Restore verified published data or the latest successful automatic export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r run_id artifact < <(node .github/scripts/select-release-source.mjs)
          test -n "$run_id"
          gh run download "$run_id" --name "$artifact" --dir /tmp/release-data
          echo "Restored $artifact from run $run_id"
          mkdir -p /tmp/extracted
          tar -xf /tmp/release-data/artifact.tar -C /tmp/extracted
          test -f /tmp/extracted/static-data/manifest.json
          cp -R /tmp/extracted/static-data frontend/public/static-data
      - name: Cache public SEC archives and security mappings
        uses: actions/cache@v4
        with:
          path: .cache/sec13f
          key: sec13f-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sec13f-v2-
      - name: Prepare independently verifiable book evidence
        if: ${{ !inputs.ui_only }}
        working-directory: frontend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m pip install 'yfinance==1.2.1' 'pandas_market_calendars==5.4.0'
          python tools/test_sec_financials.py
          python tools/test_export_book_benchmark.py
          python tools/export-book-benchmark.py --allow-unavailable
          python tools/restore-candidate-history.py
          python tools/export-sector-prices.py
          node tools/repair-price-history.mjs
          python tools/test_institutional_holdings.py
          python tools/test_recalculate_setups.py
          python tools/export-institutional.py --refresh --mapping-limit 200
          python tools/recalculate-setups.py
          node tools/export-research.mjs
          python tools/test_export_entry_context.py
          python tools/sec-financials.py --limit 60
          python tools/test_export_financial_history.py
          python tools/export-financial-history.py --limit 200
          node tools/export-research.mjs
          python tools/export-entry-context.py
      - name: Prepare workbench using verified published evidence
        if: ${{ inputs.ui_only }}
        working-directory: frontend
        run: |
          python -m pip install 'yfinance==1.2.1' 'pandas_market_calendars==5.4.0'
          python tools/export-book-benchmark.py --allow-unavailable
          python tools/restore-candidate-history.py
          python tools/export-sector-prices.py
      - name: Build with daily selection export
        working-directory: frontend
        env:
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        run: |
          npm run build
          node tools/check-data-quality.mjs
      - name: Recheck main and quality gates before uploading
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publication-gate.mjs --require
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
          retention-days: 7
      - name: Reject a superseded release immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publication-gate.mjs --require
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deploy
