name: Financial Renewal Candidate Transport
on:
  push:
    branches: [diagnostic/financial-renewal-candidate-transport-20261007]
permissions:
  contents: read
  actions: read
concurrency:
  group: financial-renewal-candidate-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport:
    name: TRANSPORT ONLY - exact real renewal candidate artifact ZIP
    if: github.repository == 'kusennjp1-ai/screener' && github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/financial-renewal-candidate-transport-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bounded transport offline
        run: python -m unittest discover -s .github/scripts -p test_financial_renewal_candidate_transport.py -v
      - name: Authenticate and split the exact original artifact ZIP
        id: prepare
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/financial-renewal-candidate-transport.py prepare --directory "$RUNNER_TEMP/financial-renewal-candidate-transport"
      - name: Retain original ZIP bytes - part 001
        if: ${{ fromJSON(steps.prepare.outputs.part_count) >= 1 }}
        id: part1
        uses: actions/upload-artifact@v4
        with:
          name: financial-renewal-candidate-transport-${{ github.run_id }}-${{ github.run_attempt }}-part-001
          path: ${{ runner.temp }}/financial-renewal-candidate-transport/part-001.bin
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
