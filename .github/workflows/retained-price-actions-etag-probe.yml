name: Actions jobs ETag capability probe
on:
  push:
    branches:
      - finite-actions-etag-capability-a13
permissions:
  contents: read
  actions: read
concurrency:
  group: finite-actions-etag-capability-a13
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'kusennjp1-ai/screener' && github.event_name == 'push' && github.ref == 'refs/heads/finite-actions-etag-capability-a13' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify exact disabled code and isolated caller
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const base='2e289c42c00e0d0bad05263ab8273a257dc0ae8e';
          const tree='e22ddee3121979d0ef805601cd9f7265f79fc643';
          const branch='finite-actions-etag-capability-a13';
          const workflow='.github/workflows/retained-price-actions-etag-probe.yml';
          const check=(v,m)=>{if(!v)throw Error(m);};
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8',timeout:10000,maxBuffer:1024**2}).trim();
          check(!process.env.GH_TOKEN&&!process.env.GITHUB_TOKEN,'Token exposed outside metadata step');
          check(process.version==='v22.23.3','Unexpected Node runtime');
          check(process.env.GITHUB_EVENT_NAME==='push'&&process.env.GITHUB_REPOSITORY==='kusennjp1-ai/screener'
            &&process.env.GITHUB_REPOSITORY_ID==='1203919607'&&process.env.GITHUB_REF==='refs/heads/'+branch
            &&process.env.GITHUB_RUN_ATTEMPT==='1'&&process.env.GITHUB_WORKFLOW_SHA===process.env.GITHUB_SHA
            &&process.env.GITHUB_WORKFLOW_REF==='kusennjp1-ai/screener/'+workflow+'@refs/heads/'+branch,'Wrong exact probe context');
          check(git('rev-parse','HEAD')===process.env.GITHUB_SHA&&git('show','-s','--format=%P','HEAD')===base,'Wrong sole retired parent');
          check(git('rev-parse',base+'^{tree}')===tree&&git('diff','--name-only',base,'HEAD')===workflow,'Changed production tree');
          const raw=readFileSync('.github/retained-price-oct6-source.json');
          check(createHash('sha1').update('blob '+raw.length+'\0').update(raw).digest('hex')==='3b2bc955ce66ba5a97e7dd9b3a5587c605b4350a','Changed disabled request');
          const request=JSON.parse(raw);
          check(request.enabled===false&&request.activation===null,'Finite request enabled');
          check(git('hash-object','.github/scripts/retained-price-repository-inventory.mjs')==='41e3f4712a635a3e68f3e8bf78ac4f62ac92ccd9','Changed inventory correction');
          console.log('ACTIONS_ETAG_PROBE_EXACT_DISABLED_PREFLIGHT_PASS');
          NODE
      - name: Measure bounded authenticated Actions jobs conditional responses
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {performance} from 'node:perf_hooks';
          const HOST='https://api.github.com',RUN=37858469362,HEAD='6ddd47cf8644e804c16206b466d49c4bc084016d';
          const JOBS='/repos/kusennjp1-ai/screener/actions/runs/'+RUN+'/jobs?filter=all&per_page=100';
          const CAPS={requests:4,total_ms:50000,request_ms:10000,response_bytes:1024**2,aggregate_bytes:4*1024**2,output_bytes:64*1024,quota_reserve:100};
          const hash=v=>createHash('sha256').update(v).digest('hex');
          const check=(v,reason)=>{if(!v)throw Object.assign(Error(reason),{probeReason:reason});};
          const object=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
          const positive=v=>Number.isSafeInteger(v)&&v>0;
          const report={schema_version:'actions-jobs-etag-capability-v1',capability_probe:true,publication_authority:false,
            original_denied_proof_replaced:false,fixed_run_id:RUN,limits:CAPS,requests:[],assertions:{},own_request_counts:{total:0,rate_limit_overviews:0,jobs_200:0,jobs_304:0}};
          const started=performance.now();let aggregate=0;
          const headers={Accept:'application/vnd.github+json',Authorization:'Bearer '+process.env.GH_TOKEN,
            'X-GitHub-Api-Version':'2022-11-28','User-Agent':'screener-actions-etag-capability-probe'};
          function safe(h){
            const out={};
            for(const key of['x-ratelimit-limit','x-ratelimit-remaining','x-ratelimit-reset','x-ratelimit-used','content-length']){
              const v=h.get(key);if(v!==null){check(/^\d{1,15}$/.test(v)&&Number.isSafeInteger(Number(v)),'invalid-safe-numeric-header');out[key]=Number(v);}
            }
            const resource=h.get('x-ratelimit-resource');if(resource!==null){check(resource==='core','unexpected-rate-resource');out['x-ratelimit-resource']=resource;}
            const id=h.get('x-github-request-id');if(id!==null&&/^[A-Za-z0-9:-]{1,128}$/.test(id))out['x-github-request-id']=id;
            out.retry_after_present=h.has('retry-after');return out;
          }
          const etagValid=v=>typeof v==='string'&&v.length<=256&&/^(?:W\/)?"[\x21\x23-\x7e]*"$/.test(v);
          async function request(path,kind,validator=null){
            check(['/rate_limit',JOBS].includes(path),'unapproved-route');
            check(report.requests.length<CAPS.requests,'request-cap');
            const left=Math.floor(CAPS.total_ms-(performance.now()-started));check(left>0,'shared-time-cap');
            const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),Math.min(CAPS.request_ms,left));
            const item={ordinal:report.requests.length+1,kind,requested_route:path,conditional:validator!==null,
              validator_sha256:validator===null?null:hash(validator),status:null,body_bytes:0,body_sha256:null,safe_headers:{}};
            report.requests.push(item);report.own_request_counts.total++;
            if(path==='/rate_limit')report.own_request_counts.rate_limit_overviews++;
            const at=performance.now();let response;
            try{
              if(validator!==null)check(etagValid(validator),'invalid-request-validator');
              response=await fetch(HOST+path,{headers:validator===null?headers:{...headers,'If-None-Match':validator},
                redirect:'error',cache:'no-store',signal:controller.signal});
              item.status=response.status;item.safe_headers=safe(response.headers);
              check(response.url===HOST+path&&!response.redirected,'response-origin-or-redirect');
              check([200,304].includes(response.status)&&!response.headers.has('retry-after'),'http-or-security-denial');
              check(item.safe_headers['x-ratelimit-remaining']!==0,'exhausted-primary-quota');
              if(path===JOBS){
                if(response.status===200)report.own_request_counts.jobs_200++;
                if(response.status===304)report.own_request_counts.jobs_304++;
              }
              const chunks=[];let count=0;
              if(response.body)for await(const chunk of response.body){
                check(chunk instanceof Uint8Array,'invalid-response-chunk');count+=chunk.byteLength;aggregate+=chunk.byteLength;
                check(count<=CAPS.response_bytes&&aggregate<=CAPS.aggregate_bytes,'response-byte-cap');chunks.push(chunk);
              }
              const raw=Buffer.concat(chunks);item.body_bytes=count;item.body_sha256=hash(raw);
              const etag=response.headers.get('etag'),link=response.headers.get('link');
              item.etag_present=etag!==null;item.etag_sha256=etag===null?null:hash(etag);
              item.link_present=link!==null;item.link_sha256=link===null?null:hash(link);
              return {raw,etag,link,status:response.status,item};
            }finally{
              controller.abort();clearTimeout(timer);item.elapsed_ms=Math.ceil(performance.now()-at);
            }
          }
          function json(raw){
            let value;try{value=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(raw));}catch{check(false,'invalid-json-or-encoding');}
            return value;
          }
          function jobs(page,link){
            check(object(page)&&Number.isSafeInteger(page.total_count)&&page.total_count>0&&page.total_count<=100
              &&Array.isArray(page.jobs)&&page.jobs.length===page.total_count&&(link===null||link===''),'incomplete-single-page-all-attempt-jobs');
            const ids=new Set();
            for(const j of page.jobs){
              check(object(j)&&positive(j.id)&&!ids.has(j.id)&&j.run_id===RUN&&j.head_sha===HEAD&&j.run_attempt===1
                &&j.status==='completed'&&typeof j.conclusion==='string'&&Array.isArray(j.steps),'invalid-or-duplicate-fixed-job');
              ids.add(j.id);
              for(const s of j.steps)check(object(s)&&typeof s.name==='string'&&s.status==='completed'
                &&typeof s.conclusion==='string','invalid-terminal-job-step');
            }
            return {total:page.total_count,unique:ids.size};
          }
          async function main(){
            check(typeof process.env.GH_TOKEN==='string'&&process.env.GH_TOKEN.length>0,'missing-read-only-token');
            const overview=await request('/rate_limit','quota-preflight');
            check(overview.status===200,'invalid-quota-preflight-status');
            const q=json(overview.raw)?.resources?.core;
            check(object(q)&&['limit','used','remaining','reset'].every(k=>Number.isSafeInteger(q[k])&&q[k]>=0)
              &&q.limit>0&&q.remaining<=q.limit&&q.reset>0,'invalid-core-quota-overview');
            const h=overview.item.safe_headers;
            const remaining=Math.min(h['x-ratelimit-remaining']??q.remaining,q.remaining),reset=h['x-ratelimit-reset']??q.reset;
            report.quota_preflight={core:Object.fromEntries(['limit','used','remaining','reset'].map(k=>[k,q[k]])),enforcing_remaining:remaining,enforcing_reset:reset,overview_and_headers_agree:
              ['limit','used','remaining','reset'].every(k=>h['x-ratelimit-'+k]===undefined||h['x-ratelimit-'+k]===q[k])};
            check(remaining>=CAPS.quota_reserve,'insufficient-conservative-probe-reserve');
            const first=await request(JOBS,'initial-full-representation');
            check(first.status===200&&etagValid(first.etag),'jobs-etag-capability-absent');
            const firstCounts=jobs(json(first.raw),first.link);
            const conditional=await request(JOBS,'same-representation-conditional',first.etag);
            check(conditional.status===304&&conditional.raw.length===0,'conditional-304-capability-absent');
            check(conditional.etag===null||conditional.etag===first.etag,'conditional-etag-conflict');
            check(conditional.link===null||conditional.link===first.link,'conditional-pagination-conflict');
            check(conditional.item.validator_sha256===first.item.etag_sha256,'unbound-304-validator');
            const retainedCounts=jobs(json(first.raw),first.link);
            check(firstCounts.total===retainedCounts.total&&firstCounts.unique===retainedCounts.unique,'retained-body-validation-changed');
            const mismatch='"probe-mismatch-'+hash(first.etag+'-control')+'"';
            check(etagValid(mismatch)&&mismatch!==first.etag,'invalid-mismatched-validator-control');
            const control=await request(JOBS,'unequal-validator-control',mismatch);
            check(control.status===200,'mismatched-validator-control-not-200');
            const controlCounts=jobs(json(control.raw),control.link);
            report.job_counts={initial:firstCounts,revalidated:retainedCounts,control:controlCounts};
            report.assertions={fixed_url_and_auth_headers:true,initial_complete_200_with_etag:true,returned_validator_requested:true,
              actual_authenticated_304:true,empty_304_body:true,revalidated_original_complete_body:true,unequal_validator_control_200:true,
              control_body_identical:first.item.body_sha256===control.item.body_sha256,actual_changed_body_case_tested:false,
              no_retries:true,no_stale_on_error:true,raw_jobs_emitted:false,credentials_emitted:false};
            report.shared_counter_observations=report.requests.slice(1).map((r,i)=>{
              const prior=report.requests[i].safe_headers,current=r.safe_headers;
              return {ordinal:r.ordinal,same_reset:prior['x-ratelimit-reset']===current['x-ratelimit-reset'],
                installation_used_delta:prior['x-ratelimit-reset']===current['x-ratelimit-reset']&&Number.isSafeInteger(prior['x-ratelimit-used'])
                  &&Number.isSafeInteger(current['x-ratelimit-used'])?current['x-ratelimit-used']-prior['x-ratelimit-used']:null,
                own_expected_primary_debit:r.status===304?0:1,includes_possible_concurrent_consumers:true};
            });
            report.status='passed';
          }
          try{await main();}catch(e){report.status='failed';report.reason=e.probeReason??'unclassified-probe-transport-failure';process.exitCode=1;}
          report.aggregate_body_bytes=aggregate;report.elapsed_ms=Math.ceil(performance.now()-started);
          let output=JSON.stringify(report);
          if(Buffer.byteLength(output)>CAPS.output_bytes){process.exitCode=1;output=JSON.stringify({status:'failed',reason:'probe-output-cap'});}
          console.log('ACTIONS_JOBS_ETAG_CAPABILITY_REPORT '+output);
          NODE
