name: Check browser server header code
on:
  push:
    branches:
      - finite-browser-header-unit-check-a11
permissions:
  contents: read
concurrency:
  group: finite-browser-header-unit-check-a11
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'kusennjp1-ai/screener' && github.event_name == 'push' && github.ref == 'refs/heads/finite-browser-header-unit-check-a11' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify exact code-only candidate and disabled request
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {createHash} = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const {readFileSync} = require('node:fs');
          const base = 'b464cd32691853b7128189f4e3350b74959468bb';
          const workflow = '.github/workflows/retained-price-browser-header-unit-check.yml';
          const pins = {
            '.github/scripts/retained-price-source-browser.mjs': '385ca311d0b0d26d76f0bab2826a5114bf15a368',
            '.github/scripts/retained-price-source-browser.test.mjs': 'f026057acb54bbf2fb61095cfbb9d421c8031e5d',
            '.github/retained-price-oct6-source.json': '3b2bc955ce66ba5a97e7dd9b3a5587c605b4350a',
          };
          const git = (...args) => execFileSync('git', args, {encoding:'utf8',maxBuffer:1024*1024}).trim();
          assert.equal(process.version, 'v22.23.3');
          assert.equal(process.env.GITHUB_REPOSITORY, 'kusennjp1-ai/screener');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/finite-browser-header-unit-check-a11');
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1');
          assert.equal(git('rev-parse','HEAD'), process.env.GITHUB_SHA);
          assert.equal(git('show','-s','--format=%P','HEAD'), base);
          assert.deepEqual(git('diff','--name-only',base,'HEAD').split('\n').sort(), [
            '.github/scripts/retained-price-source-browser.mjs',
            '.github/scripts/retained-price-source-browser.test.mjs', workflow,
          ].sort());
          for(const [path,pin] of Object.entries(pins)){
            const bytes = readFileSync(path);
            const digest = createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');
            assert.equal(digest, pin, 'Unexpected code bytes: '+path);
          }
          const request = JSON.parse(readFileSync('.github/retained-price-oct6-source.json','utf8'));
          assert.equal(request.enabled, false);
          assert.equal(request.activation, null);
          console.log(JSON.stringify({code_only:true,head:process.env.GITHUB_SHA,base,node:process.version,checked_blobs:pins,request_disabled:true}));
          NODE
      - name: Run exactly the 31 Node browser-server tests
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap .github/scripts/retained-price-source-browser.test.mjs | tee "$RUNNER_TEMP/browser-header-unit.tap"
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const {readFileSync} = require('node:fs');
          const {join} = require('node:path');
          const tap = readFileSync(join(process.env.RUNNER_TEMP,'browser-header-unit.tap'),'utf8');
          assert.match(tap, /^# tests 31$/m);
          assert.match(tap, /^# pass 31$/m);
          assert.match(tap, /^# fail 0$/m);
          console.log(JSON.stringify({code_only:true,tests:31,passed:31,failed:0,actual_data_proof:false,publication_authority:false}));
          NODE
