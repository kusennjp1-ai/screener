name: Financial Statement Capture

on:
  push:
    branches: [improve/financial-statement-capture]

permissions:
  contents: read
  actions: read

concurrency:
  group: financial-statement-recovery
  cancel-in-progress: false

jobs:
  statement-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Start the actual bounded job clock
        id: budget-clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the reviewed anonymous statement transport
        run: >-
          python -m pip install
          yfinance==0.2.66 pandas==2.2.0 numpy==1.26.3
          curl_cffi==0.16.3 requests==2.31.0 pytest==8.3.5
          certifi==2026.7.22 cffi==2.1.1
      - name: Verify capture boundaries with offline fixtures
        run: |
          node --test .github/scripts/restore-statement-capture-source.test.mjs
          python -m pytest --noconftest backend/tests/unit/test_statement_capture_controller.py backend/tests/unit/test_statement_capture_readback.py backend/tests/unit/test_statement_capture_workflow.py backend/tests/unit/test_statement_capture_transport.py -q
      - name: Restore the exact authenticated unadmitted predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_JOB_STARTED_AT: ${{ steps.budget-clock.outputs.started_at }}
        run: >-
          node .github/scripts/restore-statement-capture-source.mjs
          --output "$RUNNER_TEMP/capture-source"
      - name: Capture the exact separately admitted annual-history batch
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_JOB_STARTED_AT: ${{ steps.budget-clock.outputs.started_at }}
        run: >-
          python .github/scripts/run-statement-capture.py
          --restored "$RUNNER_TEMP/capture-source"
          --output "$RUNNER_TEMP/financial-capture"
          --inventory "$RUNNER_TEMP/capture-verification/expected-inventory.json"
          --job-started-at '${{ steps.budget-clock.outputs.started_at }}'
      - name: Retain all original and partial evidence including the empty lock
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-statement-capture-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/financial-capture/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Read back the actual uploaded artifact or fail closed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_JOB_STARTED_AT: ${{ steps.budget-clock.outputs.started_at }}
        run: >-
          python .github/scripts/verify-statement-capture-artifact.py
          --inventory "$RUNNER_TEMP/capture-verification/expected-inventory.json"
          --artifact-id '${{ steps.upload.outputs.artifact-id }}'
          --artifact-digest '${{ steps.upload.outputs.artifact-digest }}'
          --upload-root "$RUNNER_TEMP/financial-capture"
          --output "$RUNNER_TEMP/capture-verification/artifact-readback.json"
      - name: Retain external inventory preflight and readback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-statement-capture-readback-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-verification/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

# Private admission remains disabled. A push to this branch is itself execution
# and needs separate exact review. No retry, continuation, schedule or publishing.
