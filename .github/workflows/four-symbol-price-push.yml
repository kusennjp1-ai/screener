name: Four-symbol finite price push pilot

# Disabled source policy and pending intent template are committed defaults.
# No schedule, dispatch, main, or automatic registration-to-capture transition.
on:
  push:
    branches: [capture/four-symbol-price-pilot]

permissions:
  contents: read
  actions: read

concurrency:
  group: finite-four-symbol-price-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: backend

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: python -m app.scripts.price_pilot_push classify

  register-price-source:
    needs: classify
    if: needs.classify.outputs.mode == 'source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact unarmed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m app.scripts.price_pilot_push register --output "$RUNNER_TEMP/source-registration"
      - uses: actions/upload-artifact@v4
        with:
          name: price-pilot-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-registration/source-registration.json
          if-no-files-found: error
          retention-days: 14

  capture-four-symbols:
    needs: classify
    if: needs.classify.outputs.mode == 'activation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source receipt and stage exact retained evidence
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m app.scripts.price_pilot_push stage --output "$RUNNER_TEMP/price-pilot-stage"
      - name: Install reviewed full runtime from official indexes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/price-pilot-stage/source"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "from importlib.metadata import version; print('torch==' + version('torch'))" > "$RUNNER_TEMP/price-pilot-cpu-constraints.txt"
          python -m pip install --index-url https://pypi.org/simple \
            -c .github/scripts/price-pilot-offline-constraints.txt \
            -c "$RUNNER_TEMP/price-pilot-cpu-constraints.txt" \
            -r backend/requirements.txt -r backend/requirements-test.txt exchange-calendars==4.5.3
          python -m pip check
      - name: Start the isolated job budget
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name price-pilot-budget --publish 127.0.0.1:6379:6379 redis:7.4.2-alpine redis-server --save '' --appendonly no
          for readiness_attempt in {1..10}; do
            if reply="$(timeout --kill-after=1s 2s docker exec price-pilot-budget redis-cli --raw PING)" && [[ "$reply" == PONG ]]; then
              exit 0
            fi
            if (( readiness_attempt < 10 )); then sleep 1; fi
          done
          echo 'Isolated Redis was not ready; acquisition will not start.' >&2
          exit 1
      - name: Acquire four-symbol proof once
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: postgresql://price-pilot-unused.invalid/price_pilot_unused
          REDIS_ENABLED: 'true'
          REDIS_HOST: 127.0.0.1
          ADMISSION_SHA256: ${{ steps.stage.outputs.intent_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/price-pilot-stage/source"
          python -m app.scripts.bounded_price_recovery run --execute \
            --proposal docs/financial-source-evidence/four-symbol-price-recovery-proposal-2026-10-06.json \
            --admission "$RUNNER_TEMP/price-pilot-stage/intent.json" \
            --admission-sha256 "$ADMISSION_SHA256" \
            --prior-release "$RUNNER_TEMP/price-pilot-stage/prior-release.zip" \
            --output "$RUNNER_TEMP/price-pilot-capture"
      - name: Retain bounded attempt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-pilot-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/price-pilot-capture/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop the isolated budget
        if: always()
        run: docker rm --force price-pilot-budget >/dev/null 2>&1 || true
