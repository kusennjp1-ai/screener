name: Financial Release Lifecycle Rehearsal
on:
  push:
    branches: [diagnostic/financial-release-lifecycle-20261005]
permissions:
  contents: read
  actions: read
concurrency:
  group: financial-lifecycle-rehearsal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Record early rehearsal job clock
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os, time
          clock = {'schema_version': 'offline-financial-lifecycle-job-clock-v1',
                   'started_at': datetime.now(timezone.utc).isoformat(),
                   'started_monotonic_seconds': time.monotonic()}
          (Path(os.environ['RUNNER_TEMP']) / 'financial-release-job-clock.json').write_text(json.dumps(clock))
          print('Recorded job clock before checkout, setup and input downloads.')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a verified unapproved capture binding
        id: capture
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          value = json.loads(pathlib.Path('.github/scripts/fixtures/financial-release-archive-capture.json').read_text())
          assert set(value) == {'schema_version', 'capture'}
          assert value['schema_version'] == 'unapproved-financial-lifecycle-capture-v1'
          capture = value['capture']
          assert isinstance(capture, dict), 'Bind the independently verified new diagnostic before admitting the rehearsal'
          assert set(capture) == {'artifact_id', 'archive_bytes', 'archive_sha256', 'ui_sha', 'ui_tree'}
          for key in ('artifact_id', 'archive_bytes'):
            assert isinstance(capture[key], int) and not isinstance(capture[key], bool) and capture[key] > 0
          for key, length in (('archive_sha256', 64), ('ui_sha', 40), ('ui_tree', 40)):
            assert isinstance(capture[key], str) and re.fullmatch('[a-f0-9]{%d}' % length, capture[key])
          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
            for key, value in capture.items():
              output.write(f'{key}={value}\n')
          PYTHON
      - name: Fetch the exact captured Git object
        env:
          CAPTURED_SHA: ${{ steps.capture.outputs.ui_sha }}
          CAPTURED_TREE: ${{ steps.capture.outputs.ui_tree }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CAPTURED_SHA"
          test "$(git rev-parse "$CAPTURED_SHA^{tree}")" = "$CAPTURED_TREE"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check rehearsal storage budget
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          available_bytes=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$available_bytes" -ge 17179869184
      - name: Install existing offline projection dependencies
        run: |
          python -m venv "$RUNNER_TEMP/financial-replay-runtime"
          "$RUNNER_TEMP/financial-replay-runtime/bin/python" -m pip install -r .github/scripts/financial-release-projection-requirements.txt
          echo "$RUNNER_TEMP/financial-replay-runtime/bin" >> "$GITHUB_PATH"
      - name: Download exact retained review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_ARTIFACT_ID: ${{ steps.capture.outputs.artifact_id }}
        run: |
          set -euo pipefail
          input_dir="$RUNNER_TEMP/financial-release-fixture-inputs"
          mkdir -p "$input_dir"
          for pair in source:11307162746 certificate:11307009412 predecessor:11294926674 "diagnostic:$DIAGNOSTIC_ARTIFACT_ID"; do
            kind=${pair%%:*}
            artifact_id=${pair##*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$input_dir/$kind-metadata.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$input_dir/$kind.zip"
          done
      - name: Verify archives and restore the original predecessor
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, stat, tarfile, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          inputs = root / 'financial-release-fixture-inputs'
          capture = json.loads(pathlib.Path('.github/scripts/fixtures/financial-release-archive-capture.json').read_text())['capture']
          expected = {
            'source': (11307162746, 27524165, 'c4b07d50e357fb556fda62c419f0d549a1a7e62fd62dccd3a501d4d563939dbb'),
            'certificate': (11307009412, 3152346, 'fbe0e5e2a8a683596acaa6a133c8e642215fde0e4f332449cc635feec3a11958'),
            'predecessor': (11294926674, 306512046, '7bb431dc9c730c5dd1b290c68d5b6e738d8ffc808578162ba2fbd7f28aaa246d'),
            'diagnostic': (capture['artifact_id'], capture['archive_bytes'], capture['archive_sha256']),
          }
          manifest = {'directory': str(root / 'financial-release-archive-lifecycle'),
                      'predecessor_root': str(inputs / 'predecessor'),
                      'captured_ui': {'sha': capture['ui_sha'], 'tree': capture['ui_tree']}}
          for kind, (artifact_id, size, checksum) in expected.items():
            path = inputs / (kind + '.zip')
            metadata = json.loads((inputs / (kind + '-metadata.json')).read_text())
            assert metadata['id'] == artifact_id and metadata['expired'] is False
            assert metadata['size_in_bytes'] == size and metadata['digest'] == 'sha256:' + checksum
            assert path.stat().st_size == size
            with path.open('rb') as f:
              assert hashlib.file_digest(f, 'sha256').hexdigest() == checksum
            manifest[kind + '_zip'] = str(path)
            manifest[kind + '_sha256'] = checksum
          destination = pathlib.Path(manifest['predecessor_root'])
          destination.mkdir()
          with zipfile.ZipFile(inputs / 'predecessor.zip') as z:
            members = [m for m in z.infolist() if not m.is_dir()]
            assert len(members) == 1 and members[0].filename == 'artifact.tar'
            assert not stat.S_ISLNK(members[0].external_attr >> 16)
            total, seen = 0, set()
            with z.open(members[0]) as source, tarfile.open(fileobj=source, mode='r|*') as t:
              for m in t:
                name = m.name
                while name.startswith('./'):
                  name = name[2:]
                name = name.rstrip('/')
                if not name or name == '.':
                  continue
                assert not name.startswith('/') and '\\' not in name
                assert all(p not in ('', '.', '..') for p in name.split('/')) and name not in seen
                assert m.isfile() or m.isdir()
                seen.add(name)
                total += m.size
                assert len(seen) <= 200000 and total <= 8589934592
                path = destination / name
                if m.isdir():
                  path.mkdir(parents=True, exist_ok=True)
                else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  with t.extractfile(m) as src, path.open('xb') as dst:
                    shutil.copyfileobj(src, dst)
          (root / 'financial-release-input.json').write_text(json.dumps(manifest))
          print('Verified four immutable archives. This rehearsal has no publication authority.')
          PY
      - name: Check remaining space after restoring inputs
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          available_bytes=$(df -PB1 "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          test "$available_bytes" -ge 17179869184
      - name: Run bounded strict carry regression
        run: node --test --test-concurrency=1 .github/scripts/financial-lifecycle-watchdog.test.mjs .github/scripts/financial-release-lifecycle.test.mjs .github/scripts/financial-carry-history-date.test.mjs .github/scripts/financial-lifecycle-workflow.test.mjs
      - name: Rehearse first activation and advancing carry offline
        timeout-minutes: 97
        env:
          FINANCIAL_RELEASE_ARCHIVE_INPUT: ${{ runner.temp }}/financial-release-input.json
        run: |
          python3 .github/scripts/financial-lifecycle-watchdog.py \
            --timeout-seconds 5700 \
            --allocation-reason 'Run 37418746182 completed 32 phases in 75 minutes before final carry rechecks; measured full cost is 85-87 minutes. Diagnostic allocation only; all production validators and UI budgets are unchanged.' \
            --job-clock "$RUNNER_TEMP/financial-release-job-clock.json" \
            --job-timeout-seconds 6600 \
            --upload-reserve-seconds 600 \
            --minimum-runtime-seconds 3600 \
            --report-directory "$RUNNER_TEMP/financial-release-archive-lifecycle" \
            -- node --test --test-concurrency=1 .github/scripts/financial-release-archive-lifecycle.test.mjs
      - name: Retain rehearsal evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-release-lifecycle-rehearsal-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/financial-release-archive-lifecycle/report.json
            ${{ runner.temp }}/financial-release-archive-lifecycle/last-failure.json
            ${{ runner.temp }}/financial-release-archive-lifecycle/trace.jsonl
            ${{ runner.temp }}/financial-release-archive-lifecycle/watchdog.json
            ${{ runner.temp }}/financial-release-job-clock.json
          if-no-files-found: warn
          retention-days: 14
