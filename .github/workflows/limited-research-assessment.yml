name: Limited Research Assessment

on:
  workflow_dispatch:
    inputs:
      ui_sha:
        description: 'Exact current-main 40-character UI commit to assess; never a publication approval'
        type: string
        required: true
      baseline_sha:
        description: 'Reviewed full baseline commit; uses the identical frozen published input'
        type: string
        default: '1e1943e1d5f78a738a05baa69eb9f2e8508e32ac'
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: limited-research-assessment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  limited-assessment:
    name: Limited research preview assessment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require the exact dispatched current-main revision
        env:
          UI_SHA: ${{ inputs.ui_sha }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UI_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASELINE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$UI_SHA" = "$GITHUB_SHA"
          test "$UI_SHA" = "$GITHUB_WORKFLOW_SHA"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ui_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - name: Authenticate and freeze only the already published data
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          LIMITED_UI_SHA: ${{ inputs.ui_sha }}
          LIMITED_BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: node .github/scripts/limited-research-assessment.mjs prepare
      - name: Build the reviewed baseline against identical frozen data
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: /screener/
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags -- origin "$BASELINE_SHA"
          test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$BASELINE_SHA"
          git clone --shared "$GITHUB_WORKSPACE" "$RUNNER_TEMP/limited-research-baseline"
          git -C "$RUNNER_TEMP/limited-research-baseline" checkout --detach "$BASELINE_SHA"
          baseline="$RUNNER_TEMP/limited-research-baseline/frontend"
          rm -rf "$baseline/public/static-data"
          cp -a "$RUNNER_TEMP/limited-research-assessment/bundle/frozen/static-data" "$baseline/public/static-data"
          for file in research-daily.json portfolio-model.json qualification-audit.json ibd-reference.json; do
            cp "$RUNNER_TEMP/limited-research-assessment/bundle/frozen/$file" "$baseline/public/$file"
          done
          if cmp -s frontend/package-lock.json "$baseline/package-lock.json"; then
            ln -s "$GITHUB_WORKSPACE/frontend/node_modules" "$baseline/node_modules"
          else
            (cd "$baseline" && npm ci --no-audit --no-fund)
          fi
          mv "$baseline/public/static-data" "$RUNNER_TEMP/limited-baseline-data"
          (cd "$baseline" && npx --no-install vite build)
          mv "$RUNNER_TEMP/limited-baseline-data" "$baseline/dist/static-data"
      - name: Build the exact preview UI without regenerating any data
        env:
          GH_TOKEN: ${{ github.token }}
          VITE_STATIC_SITE: 'true'
          VITE_BASE_PATH: /screener/
          VITE_LIMITED_RESEARCH_PREVIEW: v1
          VITE_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mv frontend/public/static-data "$RUNNER_TEMP/limited-current-data"
          (cd frontend && npx --no-install vite build)
          mv "$RUNNER_TEMP/limited-current-data" frontend/dist/static-data
          node --max-old-space-size=4096 .github/scripts/design-transport.mjs frontend/dist "$RUNNER_TEMP/limited-research-assessment/input-provenance.json"
          (cd frontend && node tools/build-radar-benchmark.mjs)
          node .github/scripts/limited-research-assessment.mjs bind
      - name: Record unchanged objective checks and the original Design exit
        id: measure
        working-directory: frontend
        env:
          CURRENT_BUILD: dist
          BASELINE_BUILD: ${{ runner.temp }}/limited-research-baseline/frontend/dist
          RADAR_BUILD: test-results/radar-build
          DESIGN_REVIEW_OUTPUT: ${{ runner.temp }}/limited-research-assessment/reports
          DESIGN_RESEARCH_QUOTE_URL: ${{ vars.RESEARCH_QUOTE_URL }}
          DESIGN_INPUT_BASIS: same_verified_input
        shell: bash
        run: |
          set -uo pipefail
          node tools/design-review.mjs --limited-research-preview
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/limited-research-assessment/measurement-exit-code.txt"
          # The separate verifier only proposes measured performance limitations.
          # A later exact owner approval is mandatory before publication.
          # report.json and this original exit remain unchanged, even on failure.
          test "$status" -eq 0 -o "$status" -eq 1
      - name: Seal only the nonperformance-passing limited evidence envelope
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/limited-research-assessment.mjs seal
      - name: Retain the exact tested UI, frozen data and actual evidence bytes
        if: success() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: limited-research-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/limited-research-assessment/bundle.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Preserve original reports and screenshots even if limited assessment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limited-research-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/limited-research-assessment/reports/
            ${{ runner.temp }}/limited-research-assessment/measurement-exit-code.txt
            ${{ runner.temp }}/limited-research-assessment/input-provenance.json
          retention-days: 14
          if-no-files-found: ignore
