name: Radar Text Layout Diagnostic
on:
  push:
    branches: [diagnostic/radar-text-layout-20261004]
permissions:
  contents: read
jobs:
  bounded-text-layout:
    if: github.ref == 'refs/heads/diagnostic/radar-text-layout-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:run -- tools/radar-text-layout-contract.test.mjs tools/radar-font-resources.test.mjs tools/radar-trace-stop.test.mjs tools/radar-benchmark-context.test.mjs tools/radar-visibility.test.mjs tools/radar-fixture.test.mjs src/static/components/SetupRadar.test.jsx
        working-directory: frontend
      - run: node tools/build-radar-benchmark.mjs
        working-directory: frontend
      - run: node tools/radar-text-layout-diagnostic.mjs
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-text-layout-${{ github.sha }}-${{ github.run_attempt }}
          path: frontend/test-results/radar-text-layout/
          retention-days: 7
