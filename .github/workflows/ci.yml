name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci_unused
    services:
      financial-evidence-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_unused
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_unused"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Screening evidence regression tests
        working-directory: backend
        run: python -m pytest tests/unit/scanners/test_minervini_template_canonical.py tests/unit/scanners/test_minervini_market_gate.py tests/unit/test_precomputed_scan_context.py tests/unit/test_minervini_scanner.py tests/unit/test_eps_rating_calendar_years.py tests/unit/test_legacy_vcp_detection.py tests/unit/test_sec_edgar_financials.py tests/unit/test_refresh_code33_flags.py tests/unit/test_static_site_export_service.py -q

      - name: Price cache and downstream history regression
        working-directory: backend
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'true'
        run: python -m pytest tests/unit/test_authoritative_price_history.py tests/unit/test_benchmark_cache_service.py tests/unit/infra/test_stock_data_provider.py tests/unit/scanners/test_data_prep_cached_only.py tests/unit/test_market_regime_scan_wiring.py tests/unit/test_price_history_integrity.py tests/unit/test_cache_refresh_unification.py tests/unit/test_price_cache_warmup_store.py tests/unit/test_yahoo_batch_ingestion.py tests/unit/test_rate_budget_policy.py -q

      - name: Financial-source evidence regression
        working-directory: backend
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'true'
        run: >-
          python -m pytest
          tests/unit/test_financial_source_evidence.py
          tests/unit/test_financial_adapter_boundaries.py
          tests/unit/test_financial_evidence_cache.py
          tests/unit/test_financial_evidence_export_roundtrip.py
          tests/unit/test_financial_source_producers.py
          tests/unit/test_financial_source_transport_capture.py
          tests/unit/test_financial_source_yahoo_contract.py
          tests/unit/test_static_financial_evidence.py
          tests/unit/test_mandatory_statement_selection.py
          tests/unit/test_financial_statement_batch.py
          tests/unit/test_statement_refresh_planning.py
          tests/unit/test_statement_refresh_collection.py
          tests/unit/test_statement_artifact_archive.py
          tests/unit/test_export_statement_projection.py
          tests/unit/test_native_annual_projection.py
          tests/unit/test_quarterly_eps_pair_selection.py
          tests/unit/test_provider_snapshot_financial_evidence.py
          tests/unit/test_eps_selected_source_context.py
          tests/unit/test_growth_selected_source_context.py
          tests/unit/test_feature_run_bundle.py
          tests/unit/test_provider_snapshot_service.py
          tests/unit/test_fundamentals_cache_service_metadata_backfill.py
          tests/unit/test_fundamentals_cache_service_stale_fallback.py
          tests/unit/test_fundamentals_cache_service_preserve_missing.py
          tests/unit/test_fundamentals_completeness_integration.py
          tests/unit/test_fundamentals_provider_plan_executor.py
          tests/unit/test_hybrid_fundamentals_service.py
          tests/unit/test_hybrid_fundamentals_service_policy.py
          tests/unit/test_yfinance_get_fundamentals_classification.py
          tests/unit/test_market_cache_policy.py::test_cache_services_delegate_market_scoped_key_construction_to_policy
          tests/unit/test_market_cache_policy.py::test_fundamentals_bulk_get_reads_market_scoped_keys
          tests/unit/test_market_cache_policy.py::test_fundamentals_bulk_db_fallback_warms_market_scoped_keys
          tests/unit/test_market_cache_policy.py::test_fundamentals_cache_invalidate_uses_market_scoped_key
          tests/unit/test_growth_cadence_service.py
          tests/unit/test_eps_rating_calendar_years.py
          -q

      - name: Financial evidence PostgreSQL migration and concurrency
        working-directory: backend
        env:
          STOCKSCANNER_TEST_ALLOW_POSTGRES: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'true'
        run: >-
          python -m pytest
          tests/unit/test_financial_evidence_cache.py::test_postgres_migration_adds_nullable_jsonb_without_rewriting_values
          tests/unit/test_financial_evidence_cache.py::test_postgres_advisory_lock_serializes_concurrent_source_pairs
          -q

      - name: "Gate 0: Theme identity invariants"
        run: make gate-identity

      - name: Gate check (verify all SE test files are assigned)
        run: make gate-check

      - name: "Gate 1: Detector correctness"
        run: make gate-1

      - name: "Gate 2: Temporal integrity"
        run: make gate-2

      - name: "Gate 3: Integration coverage"
        run: make gate-3

      - name: "Gate 4: Performance baselines"
        run: make gate-4

      - name: "Gate 5: Golden regression"
        run: make gate-5

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Financial correction controller contracts
        # The ZIP/schema verifier uses the same pinned helper as source replay.
        run: |
          python3 -m pip install -r .github/scripts/financial-correction-certification-requirements.txt
          python3 -m unittest discover -s .github/scripts -p "test_retain_financial_diagnostic.py"
          node --test .github/scripts/financial-correction.test.mjs .github/scripts/financial-candidate-preview.test.mjs .github/scripts/financial-candidate-preview-v2.test.mjs .github/scripts/financial-candidate-baseline.test.mjs .github/scripts/financial-preview-comparison.test.mjs .github/scripts/financial-preview-source-phase.test.mjs .github/scripts/verify-certified-correction-source.test.mjs .github/scripts/financial-release-activation.test.mjs

      - name: Test
        run: cd frontend && npm run test:run

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Smoke test
        run: cd frontend && npm run test:smoke

      - name: Preserve smoke failure evidence
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-browser-evidence
          path: frontend/test-results/

  static-browser:
    name: Static Browser Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Static research accessibility and mobile chart regression
        run: cd frontend && npx playwright test --config playwright.static.config.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-browser-evidence
          path: frontend/test-results/

  assistant-compose-smoke:
    name: Assistant Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assistant profile compose smoke
        run: bash scripts/run_docker_assistant_compose_smoke.sh

  publish-images:
    name: Publish Docker Images
    needs: [backend, frontend, assistant-compose-smoke, static-browser]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/stockscreenclaude-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/stockscreenclaude-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  release:
    name: Create GitHub Release
    needs: [backend, frontend, publish-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
