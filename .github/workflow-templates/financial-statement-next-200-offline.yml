# Inert candidate only: outside .github/workflows. No restoration or collection.
name: Next 200 Consumer Expiry Offline Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reviewed offline test dependencies
        run: >-
          python -m pip install yfinance==0.2.66 pandas==2.2.0 numpy==1.26.3
          curl_cffi==0.16.3 requests==2.31.0 pytest==8.3.5 jsonschema==4.23.0
      - name: Check disabled finite selection, provenance and provider boundaries
        run: >-
          python -m pytest --noconftest --import-mode=importlib -p no:cacheprovider
          backend/tests/unit/test_postcapture_next_200_preparation.py
          backend/tests/unit/test_postcapture_next_200_collector.py
          backend/tests/unit/test_next200_consumer_selection.py
          backend/tests/unit/test_statement_retention_budget.py
          .github/scripts/verify-postcapture-correction-archive.test.py
          .github/scripts/verify-postcapture-statement-baseline.test.py -q
      - name: Check restoration remains separately gated
        run: >-
          node --test --test-concurrency=2
          .github/scripts/restore-statement-source.test.mjs
          .github/scripts/verify-postcapture-correction-source.test.mjs
          .github/scripts/restore-postcapture-statement-source.test.mjs
# To run this candidate in GitHub requires a separately reviewed workflow change.
# This file cannot schedule a job and grants no provider or publication authority.
