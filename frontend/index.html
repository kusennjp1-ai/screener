<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fire.svg" />
    <link rel="apple-touch-icon" href="/fire.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="米国株スクリーナー — Minervini / CANSLIM / 騰落 / 業種グループの日次スナップショット" />
    <meta name="theme-color" content="#10121D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="米国株スクリーナー" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>米国株スクリーナー</title>
    <!-- Painted before any script arrives: a shell with no data on the brief's ground. The inline script
         picks the ground from the stored colour mode with a class on <html>; those rules outrank a bare body
         rule (index.css), so the ground holds once the stylesheet arrives before the scripts, and the brief's
         :root[data-theme] rules outrank them in turn. The connected app drops the class. Without the script
         (a strict CSP), the shell keeps the browser's ground and dark text. -->
    <style>
      :where(html, body) { margin: 0; }
      html.boot-dark, .boot-dark body { background: #10121D; }
      html.boot-light, .boot-light body { background: #F3F4F8; }
      .boot-shell { color: #222238; font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; }
      .boot-shell header { display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; min-height: calc(48px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0; border-bottom: 1px solid #E0E2ED; }
      .boot-shell b { font-size: 16px; }
      .boot-shell span { font-size: 11px; color: #676A82; }
      .boot-dark .boot-shell { color: #F0F2FA; }
      .boot-dark .boot-shell header { border-bottom-color: #343B51; }
      .boot-dark .boot-shell span { color: #A2ADC5; }
    </style>
    <script>
      try { var light = localStorage.getItem('screener:color-mode') === 'light'; document.documentElement.classList.add(light ? 'boot-light' : 'boot-dark'); if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F3F4F8'); } catch (error) { document.documentElement.classList.add('boot-dark'); }
    </script>
  </head>
  <body>
    <div id="root"><div class="boot-shell"><header><b>米国株スクリーナー</b><span>読み込み中…</span></header></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
